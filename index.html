<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discord 一括ツール</title>
<style>
:root{
  --bg:#1a1b1e; --bg2:#232428; --bg3:#2b2d31; --bd:#3a3c42;
  --fg:#e6e7ea; --dim:#9aa0a6; --acc:#5865f2; --ok:#3ba55d; --warn:#faa81a; --err:#ed4245;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,"Segoe UI",Meiryo,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700}
header .sub{color:var(--dim);font-size:11px}
.tabs{display:flex;gap:6px;padding:10px 16px 0;flex-wrap:wrap}
.tab{background:var(--bg2);border:1px solid var(--bd);color:var(--dim);padding:7px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:12px}
.tab.on{background:var(--bg3);color:#fff;border-bottom-color:var(--bg3)}
main{padding:0 16px 40px}
.panel{display:none;border-top:1px solid var(--bd);padding-top:14px}
.panel.on{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}
label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
input[type=text],textarea{width:100%;background:var(--bg2);border:1px solid var(--bd);color:var(--fg);border-radius:8px;padding:8px 10px;font:12px/1.5 ui-monospace,Consolas,monospace}
textarea{min-height:130px;resize:vertical}
.f{flex:1 1 260px}
.f2{flex:0 1 160px}
.btns{display:flex;gap:8px;align-items:center;margin:6px 0 12px;flex-wrap:wrap}
button{background:var(--acc);border:0;color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
button.ghost{background:var(--bg3);color:var(--fg)}
button:disabled{opacity:.45;cursor:default}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg);margin-bottom:8px}
.log{background:#131417;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;height:290px;overflow:auto;font:11.5px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.log div{word-break:break-all}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}.dim{color:var(--dim)}.info{color:#8ea1ff}
.stat{font-size:11px;color:var(--dim);margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>Discord 一括ツール</h1>
  <span class="sub">proxy: corsproxy.rucydev.workers.dev ／ 待機3秒・最大試行4回はコード固定</span>
</header>

<div class="tabs">
  <button class="tab on" data-t="j">Joiner</button>
  <button class="tab" data-t="l">Leaver</button>
  <button class="tab" data-t="r">Raider</button>
  <button class="tab" data-t="d">DM Spammer</button>
</div>

<main>
  <section class="panel on" id="p-j">
    <div class="row">
      <div class="f"><label>招待リンク / 招待コード</label><input type="text" id="j-invite" placeholder="https://discord.gg/xxxxxxx" /></div>
    </div>
    <div class="row">
      <div class="f"><label>トークン（1行に1つ / email:pass:token 形式でも可）</label><textarea id="j-tokens" placeholder="token1&#10;token2"></textarea></div>
    </div>
    <label class="chk"><input type="checkbox" id="j-cancel" checked /> 正常実行できない場合にキャンセルする</label>
    <label class="chk"><input type="checkbox" id="j-skipcheck" /> 参加前チェックを省略する（既参加スキップ判定をしない）</label>
    <div class="btns"><button id="j-start">開始</button><button class="ghost" id="j-stop" disabled>停止</button><span class="stat" id="j-stat"></span></div>
    <div class="log" id="j-log"></div>
  </section>

  <section class="panel" id="p-l">
    <div class="row">
      <div class="f"><label>サーバーID（空なら全サーバーから退出）</label><input type="text" id="l-guild" placeholder="123456789012345678" /></div>
    </div>
    <div class="row">
      <div class="f"><label>トークン（1行に1つ）</label><textarea id="l-tokens" placeholder="token1&#10;token2"></textarea></div>
    </div>
    <label class="chk"><input type="checkbox" id="l-cancel" checked /> 正常実行できない場合にキャンセルする</label>
    <div class="btns"><button id="l-start">開始</button><button class="ghost" id="l-stop" disabled>停止</button><span class="stat" id="l-stat"></span></div>
    <div class="log" id="l-log"></div>
  </section>

  <section class="panel" id="p-r">
    <div class="row">
      <div class="f"><label>招待リンク / 招待コード</label><input type="text" id="r-invite" placeholder="https://discord.gg/xxxxxxx" /></div>
      <div class="f2"><label>送信回数</label><input type="text" id="r-count" value="5" /></div>
    </div>
    <div class="row">
      <div class="f"><label>トークン（1行に1つ）</label><textarea id="r-tokens" placeholder="token1&#10;token2"></textarea></div>
    </div>
    <div class="row">
      <div class="f"><label>送信メッセージ（{n} は連番に置換）</label><input type="text" id="r-msg" value="raided {n}" /></div>
    </div>
    <label class="chk"><input type="checkbox" id="r-cancel" checked /> 正常実行できない場合にキャンセルする</label>
    <div class="btns"><button id="r-start">開始</button><button class="ghost" id="r-stop" disabled>停止</button><span class="stat" id="r-stat"></span></div>
    <div class="log" id="r-log"></div>
  </section>

  <section class="panel" id="p-d">
    <div class="row">
      <div class="f"><label>送信先（ユーザーID または チャンネルID）</label><input type="text" id="d-target" placeholder="123456789012345678" /></div>
      <div class="f2"><label>送信回数</label><input type="text" id="d-count" value="5" /></div>
    </div>
    <div class="row">
      <div class="f"><label>トークン（1行に1つ）</label><textarea id="d-tokens" placeholder="token1&#10;token2"></textarea></div>
    </div>
    <div class="row">
      <div class="f"><label>送信メッセージ（{n} は連番に置換）</label><input type="text" id="d-msg" value="dm {n}" /></div>
    </div>
    <label class="chk"><input type="checkbox" id="d-cancel" checked /> 正常実行できない場合にキャンセルする</label>
    <div class="btns"><button id="d-start">開始</button><button class="ghost" id="d-stop" disabled>停止</button><span class="stat" id="d-stat"></span></div>
    <div class="log" id="d-log"></div>
  </section>
</main>

<div id="hc-host"></div>

<script>
/* =========================================================
   固定設定（UIに出さない / ここを書き換えれば変更可）
   ========================================================= */
const WORKER          = 'https://corsproxy.rucydev.workers.dev/';
const USE_PROXY       = true;   // プロキシ必須環境前提（CORS回避）
const PER_WAIT        = 3000;   // 1アカウントごとの待機(ms)
const MAX_CAPTCHA_TRY = 4;      // captcha最大試行回数
const COOLDOWN_EVERY  = 10;     // 何アカウントごとに休むか
const COOLDOWN_WAIT   = 15000;  // 休憩(ms)
const JITTER          = 1200;   // 待機ゆらぎ(ms)
const MSG_WAIT        = 1300;   // メッセージ送信間隔(ms)

const API           = 'https://discord.com/api/v10';
const CLIENT_BUILD  = 634304;
const NATIVE_BUILD  = 55375;
const CLIENT_VER    = '1.0.9261';
const DISCORD_UA    = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) discord/' +
                      CLIENT_VER + ' Chrome/134.0.6998.205 Electron/35.3.0 Safari/537.36';

/* ================= ユーティリティ ================= */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const rand  = (n) => Math.floor(Math.random() * n);
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const val = (id) => document.getElementById(id).value;
const chk = (id) => document.getElementById(id).checked;

const stop = { j:false, l:false, r:false, d:false };

function log(box, msg, cls){
  const el = document.getElementById(box + '-log');
  if(!el) return;
  const d = document.createElement('div');
  if(cls) d.className = cls;
  const t = new Date().toLocaleTimeString('ja-JP', {hour12:false});
  d.textContent = '[' + t + '] ' + msg;
  el.appendChild(d);
  while(el.childNodes.length > 600) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
function stat(tool, s){ const e = document.getElementById(tool + '-stat'); if(e) e.textContent = s; }
function setRunning(tool, on){
  document.getElementById(tool + '-start').disabled = on;
  document.getElementById(tool + '-stop').disabled = !on;
}

function parseTokens(s){
  return String(s || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(':');
    return p[p.length - 1].trim();
  }).filter(t => t.length > 20);
}
function inviteCode(input){
  let s = String(input || '').trim();
  const m = s.match(/(?:discord\.(?:gg|com\/invite)\/)?([A-Za-z0-9\-_]+)\/?$/);
  return m ? m[1] : s;
}

/* ================= HTTP ================= */
function superProps(){
  return b64(JSON.stringify({
    os: 'Windows', browser: 'Chrome', device: '', system_locale: 'ja-JP',
    browser_user_agent: DISCORD_UA, browser_version: '134.0.6998.205',
    os_version: '10', referrer: '', referring_domain: '', referrer_current: '',
    referring_domain_current: '', release_channel: 'stable',
    client_build_number: CLIENT_BUILD, client_event_source: null,
    client_version: CLIENT_VER, native_build_number: NATIVE_BUILD, design_id: 0
  }));
}
function apiUrl(path){
  return USE_PROXY ? (WORKER + API + path) : (API + path);
}

async function dapi(path, opts){
  opts = opts || {};
  const headers = Object.assign({
    'Accept': '*/*',
    'Accept-Language': 'ja,en-US;q=0.9,en;q=0.8',
    'User-Agent': DISCORD_UA,
    'X-Super-Properties': superProps(),
    'Origin': 'https://discord.com',
    'Referer': 'https://discord.com/'
  }, opts.headers || {});
  if(opts.token) headers['Authorization'] = opts.token;

  let body;
  if(opts.body !== undefined){
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(opts.body);
  }

  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 30000);
  try{
    const r = await fetch(apiUrl(path), {
      method: opts.method || 'GET',
      headers: headers,
      body: body,
      credentials: 'omit',
      signal: ctrl.signal
    });
    const text = await r.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
    return { status: r.status, data: data, text: text };
  }catch(e){
    return { status: 0, data: { error: String(e && e.message || e) }, net: true };
  }finally{
    clearTimeout(to);
  }
}

/* ================= hCaptcha ================= */
let hcLoading = null, hcCSSInjected = false;
function loadHCaptcha(){
  if(window.hcaptcha) return Promise.resolve();
  if(hcLoading) return hcLoading;
  hcLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://js.hcaptcha.com/1/api.js?render=explicit';
    s.async = true; s.defer = true;
    s.onload = () => {
      let n = 0;
      const t = setInterval(() => {
        if(window.hcaptcha){ clearInterval(t); res(); }
        else if(++n > 120){ clearInterval(t); rej(new Error('hCaptcha初期化タイムアウト')); }
      }, 100);
    };
    s.onerror = () => rej(new Error('hCaptcha読込失敗'));
    document.head.appendChild(s);
  });
  return hcLoading;
}
function injectHcCSS(){
  if(hcCSSInjected) return;
  hcCSSInjected = true;
  const st = document.createElement('style');
  st.textContent =
    '#hc-host{position:fixed;right:14px;bottom:14px;z-index:2147483646;display:none}' +
    '#hc-host.on{display:block}' +
    '.hc-card{background:#1e1f22;border:1px solid #2b2d31;border-radius:10px;padding:10px;' +
      'box-shadow:0 10px 34px rgba(0,0,0,.65);font:12px/1.4 system-ui,sans-serif;color:#b5bac1}' +
    '.hc-card .t{margin-bottom:8px}' +
    'iframe[src*="hcaptcha"]{z-index:2147483647 !important}';
  document.head.appendChild(st);
}
function raiseFrames(){
  document.querySelectorAll('iframe').forEach(f => {
    const s = f.src || '';
    if(s.indexOf('hcaptcha') !== -1){
      f.style.zIndex = '2147483647';
      try { f.style.position = 'fixed'; } catch(e){}
    }
  });
}

async function solveCaptcha(sitekey, rqdata, rqtoken, sessionId){
  if(!sitekey) throw new Error('sitekeyが取得できません');
  await loadHCaptcha();
  injectHcCSS();

  const host = document.getElementById('hc-host');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className = 'hc-card';
  const title = document.createElement('div'); title.className = 't'; title.textContent = '認証してください';
  const slot = document.createElement('div');
  card.appendChild(title); card.appendChild(slot);
  host.appendChild(card); host.classList.add('on');

  const opts = {
    sitekey: sitekey,
    theme: 'dark',
    size: 'normal',
    callback: function(){},
    'expired-callback': function(){},
    'chalexpired-callback': function(){},
    'error-callback': function(){}
  };
  if(rqdata) opts.rqdata = rqdata;

  let wid;
  try { wid = hcaptcha.render(slot, opts); }
  catch(e){ host.classList.remove('on'); throw new Error('hCaptcha描画失敗: ' + e.message); }

  const obs = new MutationObserver(raiseFrames);
  obs.observe(document.body, { childList: true, subtree: true });
  raiseFrames();

  const exec = () => { try { hcaptcha.execute(wid, rqdata ? { rqdata: rqdata } : undefined); } catch(e){} };
  setTimeout(exec, 450);

  const started = Date.now();
  return await new Promise((resolve, reject) => {
    let n = 0;
    const iv = setInterval(() => {
      n++;
      raiseFrames();
      let r = '';
      try { r = hcaptcha.getResponse(wid); } catch(e){}
      if(r){
        clearInterval(iv); obs.disconnect();
        host.classList.remove('on'); host.innerHTML = '';
        resolve(r); return;
      }
      if(n === 4 || n === 11) exec();
      if(Date.now() - started > 70000){
        clearInterval(iv); obs.disconnect();
        host.classList.remove('on'); host.innerHTML = '';
        reject(new Error('captchaタイムアウト'));
      }
    }, 400);
  });
}

/* ================= 共通API ================= */
function postJoin(token, code, body, extraHeaders){
  return dapi('/invites/' + encodeURIComponent(code), {
    method: 'POST', token: token, body: body || {}, headers: extraHeaders || {}
  });
}
async function getInvite(token, code){
  return dapi('/invites/' + encodeURIComponent(code) + '?with_counts=true&with_expiration=true', { token: token });
}
async function isInGuild(token, guildId){
  if(!guildId) return false;
  const r = await dapi('/users/@me/guilds', { token: token });
  if(r.status !== 200 || !Array.isArray(r.data)) return false;
  return r.data.some(g => g.id === guildId);
}

/* 1回の参加試行（captchaが出ればその場で1回解く） */
async function joinOnce(token, code, gid, box, tag){
  let res = await postJoin(token, code, {});
  let d = res.data || {};

  if(res.status === 200 || res.status === 204) return { ok: true };

  if(res.status === 429){
    const w = Math.max(1000, Math.ceil((d.retry_after || 1) * 1000));
    log(box, tag + ' 429 レート制限 → ' + w + 'ms 待機', 'warn');
    await sleep(w + rand(400));
    return { retry: true };
  }

  if(d.captcha_key || d.captcha_sitekey || d.captcha_service){
    log(box, tag + ' captcha要求（' + (d.captcha_service || 'hcaptcha') + '）', 'info');
    let ctok;
    try {
      ctok = await solveCaptcha(d.captcha_sitekey, d.captcha_rqdata, d.captcha_rqtoken, d.captcha_session_id);
    }catch(e){
      log(box, tag + ' captcha失敗: ' + e.message, 'err');
      return { invalid: true };
    }
    log(box, tag + ' 解答トークン取得（' + ctok.length + '文字）→ 送信', 'dim');

    const r2 = await postJoin(token, code,
      { session_id: d.captcha_session_id || '' },
      {
        'X-Captcha-Key': ctok,
        'X-Captcha-Rqtoken': d.captcha_rqtoken || '',
        'X-Captcha-Rqdata': d.captcha_rqdata || '',
        'X-Captcha-Session-Id': d.captcha_session_id || ''
      });
    const d2 = r2.data || {};

    if(r2.status === 200 || r2.status === 204) return { ok: true };

    if(r2.status === 429){
      const w = Math.max(1000, Math.ceil((d2.retry_after || 1) * 1000));
      log(box, tag + ' 429 レート制限 → ' + w + 'ms 待機', 'warn');
      await sleep(w + rand(400));
      return { retry: true };
    }

    if(r2.status === 403 && d2.code === 10008){
      log(box, tag + ' 403 / 10008（不明なメッセージ）→ 実参加を確認', 'warn');
      await sleep(1800);
      if(await isInGuild(token, gid)) return { ok: true };
      return { invalid: true };
    }

    const keys = Array.isArray(d2.captcha_key) ? d2.captcha_key : [];
    if(keys.indexOf('invalid-response') !== -1){
      log(box, tag + ' invalid-response（トークン拒否）', 'warn');
      return { invalid: true };
    }
    log(box, tag + ' 失敗 HTTP ' + r2.status + ' :: ' + JSON.stringify(d2).slice(0, 140), 'err');
    return { fail: true, data: d2, status: r2.status };
  }

  if(res.status === 403 && d.code === 10008){
    log(box, tag + ' 403 / 10008 → 実参加を確認', 'warn');
    await sleep(1800);
    if(await isInGuild(token, gid)) return { ok: true };
    return { invalid: true };
  }
  if(res.status === 403){
    log(box, tag + ' 403（BAN/制限の可能性）:: ' + JSON.stringify(d).slice(0, 140), 'err');
    return { fail: true, data: d, ban: true };
  }
  if(res.status === 404){
    log(box, tag + ' 招待が無効です', 'err');
    return { fail: true, fatal: true };
  }
  log(box, tag + ' 失敗 HTTP ' + res.status + ' :: ' + JSON.stringify(d).slice(0, 140), 'err');
  return { fail: true, data: d, status: res.status };
}

/* 1アカウントを参加させる（最大 MAX_CAPTCHA_TRY 回まで） */
async function joinAccount(token, code, gid, box, tag, cancelOnFail){
  let tries = 0, retries = 0, invalid = 0;
  while(tries < MAX_CAPTCHA_TRY && retries < 12){
    if(stop[curTool]) return { ok: false, cancelled: true };
    const r = await joinOnce(token, code, gid, box, tag);

    if(r.ok) return { ok: true };
    if(r.retry){
      retries++;
      if(cancelOnFail && retries >= 4){ log(box, tag + ' 429が連続 → キャンセル', 'err'); return { ok: false, cancelled: true }; }
      continue;
    }
    tries++;
    if(r.invalid){
      invalid++;
      if(cancelOnFail && invalid >= 3){ log(box, tag + ' invalid-responseが連続 → キャンセル', 'err'); return { ok: false, cancelled: true }; }
    }
    if(r.ban && cancelOnFail){ log(box, tag + ' 403 → キャンセル', 'err'); return { ok: false, cancelled: true }; }
    if(tries < MAX_CAPTCHA_TRY) await sleep(700 + rand(700));
  }
  log(box, tag + ' 最大試行（' + MAX_CAPTCHA_TRY + '回）に達して失敗', 'err');
  return { ok: false };
}

/* グローバルな現在ツール（stop参照用） */
let curTool = 'j';

/* ================= Joiner ================= */
async function runJoiner(){
  const invite = val('j-invite').trim();
  const tokens = parseTokens(val('j-tokens'));
  const cancelOnFail = chk('j-cancel');
  const skipCheck = chk('j-skipcheck');
  const box = 'j';

  if(!invite || !tokens.length){ log(box, '招待リンクとトークンを入力してください', 'warn'); return; }

  curTool = 'j';
  stop.j = false;
  setRunning('j', true);
  const code = inviteCode(invite);
  let ok = 0, fail = 0, skip = 0;

  log(box, '開始: ' + tokens.length + 'アカウント / 招待=' + code + ' / 待機' + (PER_WAIT/1000) + 's / 最大' + MAX_CAPTCHA_TRY + '回', 'info');

  for(let i = 0; i < tokens.length; i++){
    if(stop.j){ log(box, '停止しました', 'warn'); break; }
    const t = tokens[i];
    const tag = '[' + (i + 1) + '/' + tokens.length + '] ' + t.slice(0, 8) + '…';

    let gi = await getInvite(t, code);
    if(gi.status === 429){
      const w = Math.max(1000, Math.ceil(((gi.data && gi.data.retry_after) || 1) * 1000));
      await sleep(w); gi = await getInvite(t, code);
    }
    if(gi.status === 404){ log(box, tag + ' 招待が無効です', 'err'); fail++; stat('j', ok + '成功 / ' + fail + '失敗'); continue; }
    const gid = (gi.status === 200 && gi.data && gi.data.guild) ? gi.data.guild.id : null;

    if(!skipCheck && gid && await isInGuild(t, gid)){
      log(box, tag + ' 既に参加済み → スキップ', 'dim');
      skip++; stat('j', ok + '成功 / ' + fail + '失敗 / ' + skip + 'スキップ');
      continue;
    }

    const r = await joinAccount(t, code, gid, box, tag, cancelOnFail);
    if(r.ok){
      ok++; log(box, tag + ' 参加成功', 'ok');
    }else if(r.cancelled){
      stat('j', ok + '成功 / ' + fail + '失敗');
      break;
    }else{
      fail++;
    }
    stat('j', ok + '成功 / ' + fail + '失敗 / ' + skip + 'スキップ');

    if(i < tokens.length - 1 && !stop.j){
      if((i + 1) % COOLDOWN_EVERY === 0){
        log(box, 'クールダウン ' + (COOLDOWN_WAIT/1000) + '秒', 'dim');
        await sleep(COOLDOWN_WAIT);
      }
      await sleep(PER_WAIT + rand(JITTER));
    }
  }

  log(box, '完了: 成功' + ok + ' / 失敗' + fail + ' / スキップ' + skip, 'info');
  setRunning('j', false);
}

/* ================= Leaver ================= */
async function runLeaver(){
  const tokens = parseTokens(val('l-tokens'));
  const gid = val('l-guild').trim();
  const cancelOnFail = chk('l-cancel');
  const box = 'l';
  if(!tokens.length){ log(box, 'トークンを入力してください', 'warn'); return; }

  curTool = 'l';
  stop.l = false;
  setRunning('l', true);
  let ok = 0, fail = 0;

  for(let i = 0; i < tokens.length; i++){
    if(stop.l){ log(box, '停止しました', 'warn'); break; }
    const t = tokens[i];
    const tag = '[' + (i + 1) + '/' + tokens.length + '] ' + t.slice(0, 8) + '…';

    let list = [];
    if(gid){
      list = [gid];
    }else{
      const r = await dapi('/users/@me/guilds', { token: t });
      if(r.status !== 200 || !Array.isArray(r.data)){
        log(box, tag + ' サーバー一覧取得失敗 HTTP ' + r.status, 'err');
        fail++; continue;
      }
      list = r.data.map(g => g.id);
    }

    let a = 0, b = 0;
    for(const g of list){
      if(stop.l) break;
      const r = await dapi('/users/@me/guilds/' + g, { method: 'DELETE', token: t });
      if(r.status === 204 || r.status === 200) a++;
      else if(r.status === 429){ await sleep(Math.max(1000, Math.ceil(((r.data && r.data.retry_after) || 1) * 1000))); }
      else {
        b++;
        if(r.status === 403 && cancelOnFail){ log(box, tag + ' 403 → キャンセル', 'err'); stop.l = true; }
      }
      await sleep(700 + rand(500));
    }
    ok += a; fail += b;
    log(box, tag + ' 退出 ' + a + '件 / 失敗 ' + b + '件', a ? 'ok' : 'warn');
    stat('l', ok + '退出 / ' + fail + '失敗');
    await sleep(PER_WAIT + rand(JITTER));
  }
  log(box, '完了: 退出' + ok + ' / 失敗' + fail, 'info');
  setRunning('l', false);
}

/* ================= Raider ================= */
async function runRaider(){
  const invite = val('r-invite').trim();
  const tokens = parseTokens(val('r-tokens'));
  const count = Math.max(1, parseInt(val('r-count'), 10) || 1);
  const msg = val('r-msg');
  const cancelOnFail = chk('r-cancel');
  const box = 'r';
  if(!invite || !tokens.length){ log(box, '招待リンクとトークンを入力してください', 'warn'); return; }

  curTool = 'r';
  stop.r = false;
  setRunning('r', true);
  const code = inviteCode(invite);
  let joined = 0, sent = 0, fail = 0;

  for(let i = 0; i < tokens.length; i++){
    if(stop.r){ log(box, '停止しました', 'warn'); break; }
    const t = tokens[i];
    const tag = '[' + (i + 1) + '/' + tokens.length + '] ' + t.slice(0, 8) + '…';

    const gi = await getInvite(t, code);
    const gid = (gi.status === 200 && gi.data && gi.data.guild) ? gi.data.guild.id : null;
    const cid = (gi.status === 200 && gi.data && gi.data.channel) ? gi.data.channel.id : null;
    if(!cid){ log(box, tag + ' 招待が無効です', 'err'); fail++; continue; }

    if(!(gid && await isInGuild(t, gid))){
      const r = await joinAccount(t, code, gid, box, tag, cancelOnFail);
      if(r.ok){ joined++; log(box, tag + ' 参加成功', 'ok'); }
      else if(r.cancelled){ setRunning('r', false); return; }
      else { fail++; }
    }else{
      log(box, tag + ' 既に参加済み', 'dim');
    }

    let s = 0;
    for(let n = 0; n < count; n++){
      if(stop.r) break;
      const content = msg.replace(/\{n\}/g, String(n + 1));
      const r = await dapi('/channels/' + cid + '/messages', { method: 'POST', token: t, body: { content: content } });
      if(r.status === 200) s++;
      else if(r.status === 429) await sleep(Math.max(1000, Math.ceil(((r.data && r.data.retry_after) || 1) * 1000)));
      else if(r.status === 403){ log(box, tag + ' 送信403（チャンネル権限なし？）', 'warn'); break; }
      await sleep(MSG_WAIT + rand(600));
    }
    sent += s;
    stat('r', joined + '参加 / ' + sent + '送信 / ' + fail + '失敗');
    await sleep(PER_WAIT + rand(JITTER));
  }
  log(box, '完了: 参加' + joined + ' / 送信' + sent + ' / 失敗' + fail, 'info');
  setRunning('r', false);
}

/* ================= DM Spammer ================= */
async function runDM(){
  const target = val('d-target').trim();
  const tokens = parseTokens(val('d-tokens'));
  const count = Math.max(1, parseInt(val('d-count'), 10) || 1);
  const msg = val('d-msg');
  const box = 'd';
  if(!target || !tokens.length){ log(box, '送信先とトークンを入力してください', 'warn'); return; }

  curTool = 'd';
  stop.d = false;
  setRunning('d', true);
  let sent = 0, fail = 0;

  for(let i = 0; i < tokens.length; i++){
    if(stop.d){ log(box, '停止しました', 'warn'); break; }
    const t = tokens[i];
    const tag = '[' + (i + 1) + '/' + tokens.length + '] ' + t.slice(0, 8) + '…';

    // ユーザーIDならDMチャンネルを開く（既にチャンネルIDならそのまま使う）
    let cid = target;
    const me = await dapi('/users/@me', { token: t });
    if(me.status !== 200){ log(box, tag + ' トークン無効', 'err'); fail++; continue; }
    if(target === me.data.id){
      const ch = await dapi('/users/@me/channels', { method: 'POST', token: t, body: { recipient_id: target } });
      if(ch.status === 200 && ch.data && ch.data.id) cid = ch.data.id;
    }else{
      const ch = await dapi('/users/@me/channels', { method: 'POST', token: t, body: { recipient_id: target } });
      if(ch.status === 200 && ch.data && ch.data.id) cid = ch.data.id;
    }

    let s = 0;
    for(let n = 0; n < count; n++){
      if(stop.d) break;
      const content = msg.replace(/\{n\}/g, String(n + 1));
      const r = await dapi('/channels/' + cid + '/messages', { method: 'POST', token: t, body: { content: content } });
      if(r.status === 200) s++;
      else if(r.status === 429) await sleep(Math.max(1000, Math.ceil(((r.data && r.data.retry_after) || 1) * 1000)));
      else { log(box, tag + ' 送信失敗 HTTP ' + r.status, 'err'); break; }
      await sleep(MSG_WAIT + rand(600));
    }
    sent += s;
    log(box, tag + ' 送信 ' + s + '件', s ? 'ok' : 'warn');
    stat('d', sent + '送信 / ' + fail + '失敗');
    await sleep(PER_WAIT + rand(JITTER));
  }
  log(box, '完了: 送信' + sent + ' / 失敗' + fail, 'info');
  setRunning('d', false);
}
