<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ツール一覧</title>
<style>
  :root{
    --bg:#1e1f22; --bg2:#2b2d31; --hover:#35373c; --line:#3f4147;
    --text:#dbdee1; --muted:#949ba4;
    --blurple:#5865f2; --blurple-h:#4752c4; --red:#da373c; --red-h:#b52a2f;
    --btn-dark:#404249; --btn-dark-h:#4e5058;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:620px;margin:0 auto;padding:32px 16px 64px}
  .hidden{display:none !important}
  h1.page-title{font-size:22px;font-weight:800;margin:0 0 16px;color:#fff}

  .search{width:100%;margin-bottom:18px}
  .search input{background:var(--bg2);border:1px solid var(--line)}

  .cards{display:flex;flex-direction:column;gap:10px}
  .card{display:flex;gap:14px;align-items:center;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:14px 16px;cursor:pointer;transition:background .12s,border-color .12s}
  .card:hover{background:var(--hover);border-color:var(--blurple)}
  .card-icon{flex:none;width:38px;height:38px;border-radius:9px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--blurple)}
  .card-icon svg{width:21px;height:21px}
  .card-title{font-weight:700;color:#fff;margin-bottom:3px}
  .card-desc{color:var(--muted);font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}

  .back{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0;margin-bottom:16px;font-family:inherit}
  .back:hover{color:var(--text)}
  .detail-title{font-size:22px;font-weight:800;color:#fff;margin:0 0 6px;text-align:center}
  .detail-desc{color:var(--muted);margin:0 0 22px;text-align:center}

  .form{display:flex;flex-direction:column;gap:14px}
  .field label{display:block;color:var(--text);font-size:13px;font-weight:600;margin-bottom:6px}
  .inline{display:flex;align-items:center;gap:8px}
  .unit{color:var(--muted);font-size:13px;white-space:nowrap}
  input,textarea,select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;
    padding:9px 11px;font-family:inherit;font-size:13px;width:100%;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--blurple)}
  textarea{resize:vertical}
  .inline input,.inline textarea,.inline select{flex:1;width:auto}
  .inline input[type=number]{max-width:120px}

  .ta-wrap{position:relative}
  .ta-wrap textarea{padding-right:38px}
  .eye{position:absolute;top:7px;right:7px;width:24px;height:24px;padding:0;background:transparent;border:none;
    color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px;
    transition:color .12s,background .12s;font-family:inherit;font-size:14px;font-weight:400}
  .eye:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .eye svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .eye .eye-off{display:none}
  .ta-wrap.masked textarea{-webkit-text-security:disc;text-security:disc}
  .ta-wrap.masked .eye .eye-on{display:none}
  .ta-wrap.masked .eye .eye-off{display:block}

  .sec{border-top:1px solid var(--line);padding-top:4px}
  .sec-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:13px;padding:8px 0;user-select:none}
  .sec-head .arrow{font-size:10px;color:var(--muted);transition:transform .15s}
  .sec.closed .arrow{transform:rotate(-90deg)}
  .sec-body{display:flex;flex-direction:column;gap:14px;padding:4px 0 8px}
  .sec.closed .sec-body{display:none}

  .tg{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--text)}
  .switch{position:relative;flex:none;width:40px;height:22px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--btn-dark);border-radius:22px;transition:.15s}
  .slider::before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
  .switch input:checked + .slider{background:var(--blurple)}
  .switch input:checked + .slider::before{transform:translateX(17px)}
  .toggles{display:flex;gap:28px;flex-wrap:wrap}

  .nums{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
  .nitem{display:flex;align-items:center;gap:8px}
  .nitem label{color:var(--text);font-size:13px;font-weight:600;white-space:nowrap}
  .nitem input{width:74px}

  .inlinebtn{display:flex;align-items:center;gap:10px}
  .inlinebtn label{color:var(--text);font-size:13px;font-weight:600;white-space:nowrap}
  .inlinebtn input{width:84px}
  .helper{color:var(--muted);font-size:12px;line-height:1.55}
  .tiny{color:var(--muted);font-size:11px;line-height:1.5;margin-top:-6px}

  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:13px}
  .btn-run{background:var(--blurple);color:#fff;width:100%;font-size:14px;font-weight:700;padding:12px;margin-top:22px}
  .btn-run:hover{background:var(--blurple-h)}
  .btn-run:disabled{opacity:.5;cursor:default}
  .btn-sm{background:var(--btn-dark);color:#fff;font-size:12px;padding:8px 14px;width:auto}
  .btn-sm:hover{background:var(--btn-dark-h)}
  .btn-full{background:var(--blurple);color:#fff;width:100%;font-size:13px;padding:10px}
  .btn-full:hover{background:var(--blurple-h)}
  .btn-row{display:flex;gap:12px;margin-top:12px}
  .btn-b{flex:1;color:#fff}
  .btn-blue{background:var(--blurple)}.btn-blue:hover{background:var(--blurple-h)}
  .btn-red{background:var(--red)}.btn-red:hover{background:var(--red-h)}
  .btn-dark{background:var(--btn-dark)}.btn-dark:hover{background:var(--btn-dark-h)}

  .logbox{background:#141517;border:1px solid var(--line);border-radius:8px;padding:10px;
    height:180px;overflow-y:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;margin-top:16px}
  .log-line{padding:2px 0;white-space:pre-wrap;word-break:break-all}
  .ok{color:#3ba55d}.warn{color:#faa61a}.danger{color:#ed4245}.info{color:#c3c9d6}
</style>
</head>
<body>
<div class="wrap">
  <div id="home"></div>
  <div id="toolView" class="hidden"></div>
</div>

<script>
const BASE = 'https://discord.com/api/v10';
const WORKER = 'https://corsproxy.rucydev.workers.dev/';

let USE_PROXY = true;   // Joiner からは true 固定（UIには出さない）
const apiUrl = target => USE_PROXY ? (WORKER + '?url=' + encodeURIComponent(target)) : target;

// Discord デスクトップクライアント偽装用（User-Agent と super properties を一致させるのが重要）
const DISCORD_UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) discord/1.0.9261 Chrome/134.0.6998.205 Electron/35.3.0 Safari/537.36';

const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
  const r = Math.random() * 16 | 0;
  return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
});

// base64 を手書きせず実行時に生成 → ビルド番号の更新が1行で済む
const X_SUPER_PROPERTIES = btoa(JSON.stringify({
  os: "Windows",
  browser: "Discord Client",
  device: "",
  system_locale: "ja-JP",
  has_client_mods: false,
  client_version: "1.0.9261",
  os_version: "10",
  os_arch: "x64",
  app_arch: "x64",
  browser_user_agent: DISCORD_UA,   // ← UA と一致必須
  browser_version: "35.3.0",
  referrer: "",
  referring_domain: "",
  referrer_current: "",
  referring_domain_current: "",
  release_channel: "stable",
  client_build_number: 634304,
  client_event_source: null,
  client_launch_id: uuid(),
  launch_signature: uuid(),
  client_heartbeat_session_id: uuid()
}));

let STOP = false;
let vcGateways = [];
let statusGw = null;
let lastGroupId = null;

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const parse = s => (s || '').split(/[\s,]+/).filter(Boolean);
const uid = () => Math.floor(Math.random() * 1e16).toString();

// ヘッダー値に使えない非 ISO-8859-1 文字（日本語など）を除去
const hdr = v => String(v == null ? '' : v).replace(/[^\x00-\xFF]/g, '');
// トークン抽出（ログ行に混ざっても本体を拾う／無ければ非ASCIIを除去）
const cleanToken = t => {
  let s = String(t == null ? '' : t).replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
  const m = s.match(/[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{20,}/);
  return m ? m[0] : s.replace(/[^\x21-\x7E]/g, '');
};
const parseTokens = s => (s || '').split(/[\s,]+/).map(cleanToken).filter(Boolean);

/* ================= hCaptcha ================= */
let hcScriptLoaded = false;
function loadHCaptcha() {
  return new Promise((res, rej) => {
    if (window.hcaptcha && window.hcaptcha.render) return res();
    let waited = 0;
    const t = setInterval(() => {
      if (window.hcaptcha && window.hcaptcha.render) { clearInterval(t); res(); }
      else if ((waited += 100) > 15000) { clearInterval(t); rej(new Error('hCaptcha読込タイムアウト')); }
    }, 100);
    if (!hcScriptLoaded) {
      hcScriptLoaded = true;
      const s = document.createElement('script');
      s.src = 'https://js.hcaptcha.com/1/api.js?render=explicit';
      s.async = true; s.defer = true;
      s.onerror = () => { clearInterval(t); rej(new Error('hCaptcha読込失敗（ネットワーク/ブロック）')); };
      document.head.appendChild(s);
    }
  });
}

// 動的に挿入されるチャレンジiframeを必ず最前面に出す
function injectHcCSS() {
  if (document.getElementById('hc-css')) return;
  const st = document.createElement('style');
  st.id = 'hc-css';
  st.textContent = 'iframe[src*="hcaptcha"]{z-index:2147483647 !important}';
  document.head.appendChild(st);
}

// オーバーレイを先に表示し、hCaptcha を解かせて token を返す
// ポイント: トークンは callback の引数から取る（remove後の getResponse は空になる）
async function solveCaptcha(sitekey, rqdata, opts = {}) {
  const invisible = !!opts.invisible;

  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:2147483000';
  const box = document.createElement('div');
  box.style.cssText = 'background:#2b2d31;border:1px solid #3f4147;border-radius:10px;padding:14px 18px;color:#dbdee1;font-size:13px;text-align:center;max-width:380px';
  box.textContent = 'hCaptcha を読み込み中...';
  const holder = document.createElement('div');
  holder.style.cssText = 'background:#fff;border-radius:8px;padding:10px 12px;min-height:78px;min-width:300px;display:flex;align-items:center;justify-content:center';
  ov.appendChild(box); ov.appendChild(holder);
  document.body.appendChild(ov);
  injectHcCSS();

  try { await loadHCaptcha(); }
  catch (e) { box.textContent = 'hCaptcha読込失敗: ' + e.message; ov.remove(); throw e; }

  box.textContent = invisible ? 'hCaptcha（自動認証）を実行中...' : 'hCaptcha を解いてください（サーバー参加の認証）';

  return await new Promise((resolve, reject) => {
    let id = null, token = '', settled = false;

    const obs = new MutationObserver(() => {
      document.querySelectorAll('iframe[src*="hcaptcha"]').forEach(f => f.style.zIndex = '2147483647');
    });
    obs.observe(document.body, { childList: true, subtree: true });

    const done = ok => {
      if (settled) return; settled = true;
      obs.disconnect();
      try { if (id != null) window.hcaptcha.remove(id); } catch (e) {}
      ov.remove();
      if (ok && token) resolve(token);
      else reject(new Error('hCaptcha未解決'));
    };

    try {
      id = window.hcaptcha.render(holder, {
        sitekey,
        rqdata: rqdata || undefined,
        size: invisible ? 'invisible' : 'normal',
        theme: 'light',
        host: opts.host || undefined,
        callback: t => { token = t; setTimeout(() => done(true), 60); },
        'error-callback': () => { box.textContent = 'hCaptchaエラー。もう一度お試しください'; log('hCaptcha error-callback', 'warn'); },
        'expired-callback': () => { token = ''; box.textContent = '有効期限切れ。もう一度解いてください'; },
        'chalexpired-callback': () => { token = ''; box.textContent = 'チャレンジ期限切れ。もう一度解いてください'; }
      });
    } catch (e) {
      box.textContent = 'hCaptchaの描画に失敗: ' + e.message;
      return done(false);
    }

    if (invisible) {
      try { window.hcaptcha.execute(id, { async: true }); } catch (e) {}
    } else {
      // チェックを押してもチャレンジが出ない場合、強制的に execute する保険
      let clicked = false;
      holder.addEventListener('click', () => {
        if (clicked) return; clicked = true;
        setTimeout(() => {
          if (settled || token) return;
          const widget = holder.querySelector('iframe');
          const chal = [...document.querySelectorAll('iframe[src*="hcaptcha"]')].some(f => f !== widget);
          if (!chal) { try { window.hcaptcha.execute(id); } catch (e) {} }
        }, 1500);
      }, true);
    }
  });
}

/* ================= HTTP ================= */
async function dapi(path, token, opts = {}) {
  const target = BASE + path;
  const proxyUrl = apiUrl(target);
  const headers = {
    'Authorization': hdr(token),
    'Content-Type': 'application/json',
    'X-Super-Properties': X_SUPER_PROPERTIES,
    'User-Agent': DISCORD_UA,
    'X-Discord-Locale': 'ja-JP',
    'X-Discord-Timezone': 'Asia/Tokyo',
    'Accept': '*/*',
    'Accept-Language': 'ja-JP,ja;q=0.9,en-US;q=0.8,en;q=0.7',
    ...(opts.headers || {})
  };
  let res;
  try {
    res = await fetch(proxyUrl, { ...opts, headers });
  } catch (e) {
    throw new Error('ネットワーク/CORS: ' + e.message);
  }

  if (res.status === 429) {
    const d = await res.json().catch(() => ({}));
    const err = new Error('429 レート制限 (retry_after=' + (d.retry_after || 1) + 's)');
    err.status = 429;
    err.retryAfter = d.retry_after || Number(res.headers.get('retry-after')) || 1;
    throw err;
  }
  if (res.status === 204) return null;

  if (!res.ok) {
    let detail = '';
    try {
      const txt = await res.text();
      try { detail = JSON.stringify(JSON.parse(txt)); } catch { detail = txt; }
    } catch {}
    let hint = '';
    if (res.status === 400) hint = ' [リクエスト不正: ヘッダ偽装/トークン形式/招待コード不正など]';
    if (res.status === 401) hint = ' [トークン無効]';
    if (res.status === 403) hint = ' [権限不足/電話番号認証必要/サーバーBAN]';
    if (res.status === 404) hint = ' [対象が存在しない/招待コード無効]';
    throw new Error('HTTP ' + res.status + hint + ' :: ' + (detail || '(本文なし)'));
  }
  return res.json();
}

// 429なら待って再試行する dapi
async function dapiRetry(path, token, opts = {}, maxRate = 3) {
  let waits = 0;
  for (;;) {
    try { return await dapi(path, token, opts); }
    catch (e) {
      if (e.status === 429 && waits < maxRate) {
        waits++;
        const w = Math.min(e.retryAfter || 2, 30);
        log('429 → ' + w.toFixed(1) + 's 待機して再試行', 'warn');
        await sleep(w * 1000 + 300);
        continue;
      }
      throw e;
    }
  }
}

// 招待承諾。captcha 解答はドキュメント通り「ヘッダー」で送る（bodyにも併記）。429は retryAfter を返す。
async function acceptInvite(tk, code, sessionId, captcha) {
  const target = BASE + `/invites/${code}`;
  const proxyUrl = apiUrl(target);
  const body = { session_id: sessionId };
  const headers = {
    'Authorization': hdr(tk),
    'Content-Type': 'application/json',
    'X-Super-Properties': X_SUPER_PROPERTIES,
    'User-Agent': DISCORD_UA,
    'X-Discord-Locale': 'ja-JP',
    'X-Discord-Timezone': 'Asia/Tokyo',
    'Accept': '*/*'
  };
  if (captcha && captcha.key) {
    headers['X-Captcha-Key'] = hdr(captcha.key);
    if (captcha.rqtoken) headers['X-Captcha-Rqtoken'] = hdr(captcha.rqtoken);
    if (captcha.rqdata) headers['X-Captcha-Rqdata'] = hdr(captcha.rqdata);
    if (captcha.sessionId) headers['X-Captcha-Session-Id'] = hdr(captcha.sessionId);
    body.captcha_key = captcha.key;
    if (captcha.rqtoken) body.captcha_rqtoken = captcha.rqtoken;
    if (captcha.sessionId) body.captcha_session_id = captcha.sessionId;
  }
  let res;
  try {
    res = await fetch(proxyUrl, { method: 'POST', headers, body: JSON.stringify(body) });
  } catch (e) {
    return { ok: false, netError: e.message };
  }
  if (res.ok) return { ok: true, data: await res.json() };
  const b = await res.json().catch(() => ({}));
  return { ok: false, status: res.status, retryAfter: (b && b.retry_after) || 0, body: b };
}

/* ================= ログ ================= */
function log(msg, type = 'info') {
  const box = $('#logBox');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'log-line ' + type;
  el.textContent = `[${new Date().toLocaleTimeString('ja-JP')}] ${msg}`;
  box.prepend(el);
}

/* ================= Gateway ================= */
function connectGateway(token) {
  return new Promise((resolve, reject) => {
    let ws;
    try { ws = new WebSocket('wss://gateway.discord.gg/?v=10&encoding=json'); }
    catch (e) { return reject(e); }
    const gw = { ws, token, seq: null, hb: null, guilds: [] };
    const to = setTimeout(() => reject(new Error('Gateway timeout')), 15000);
    ws.onmessage = ev => {
      const p = JSON.parse(ev.data);
      if (p.op === 10) {
        gw.hb = setInterval(() => ws.send(JSON.stringify({ op: 1, d: gw.seq })), p.d.heartbeat_interval);
        ws.send(JSON.stringify({ op: 2, d: {
          token, capabilities: 125, compress: false,
          properties: { os: 'Windows', browser: 'Discord Client', device: '', system_locale: 'ja-JP' },
          client_state: { guild_versions: {}, highest_last_message_id: '0', read_state_version: 0, user_guild_settings_version: -1, user_settings_version: -1 }
        }}));
      } else if (p.op === 0) {
        gw.seq = p.s;
        if (p.t === 'READY') { gw.sessionId = p.d.session_id; gw.user = p.d.user; clearTimeout(to); resolve(gw); }
        else if (p.t === 'GUILD_CREATE') gw.guilds.push(p.d);
      }
    };
    ws.onerror = () => { clearTimeout(to); reject(new Error('Gateway接続失敗')); };
    ws.onclose = () => clearInterval(gw.hb);
    gw.send = (op, d) => ws.send(JSON.stringify({ op, d }));
    gw.close = () => { clearInterval(gw.hb); try { ws.close(); } catch (e) {} };
  });
}

/* ================= アイコン ================= */

/* ================= ルーター ================= */
function route() {
  const params = new URLSearchParams(location.search);
  const id = params.get('tool');
  if (!id || !TOOLS.some(t => t.id === id)) showHome();
  else showTool(id);
}
function navigate(url) {
  history.pushState({}, '', url);
  route();
}
window.addEventListener('popstate', route);

/* ================= 一覧 ================= */
function showHome(q = '') {
  document.title = 'ツール一覧';
  $('#toolView').classList.add('hidden');
  const home = $('#home');
  home.classList.remove('hidden');
  const list = TOOLS.filter(t => (t.title + t.desc).toLowerCase().includes(q.toLowerCase()));
  home.innerHTML =
    `<h1 class="page-title">ツール一覧</h1>
     <div class="search"><input id="search" placeholder="ツールを検索..." value="${q}"></div>
     <div class="cards">` +
    (list.length ? list.map(t => `<div class="card" data-id="${t.id}">
        <div class="card-icon">${ICONS[t.icon] || ''}</div>
        <div class="card-body"><div class="card-title">${t.title}</div><div class="card-desc">${t.desc}</div></div>
      </div>`).join('') : `<div class="empty">該当するツールがありません</div>`) +
    `</div>`;
  const s = $('#search');
  s.oninput = () => {
    const v = s.value; showHome(v);
    const ns = $('#search'); ns.focus(); ns.setSelectionRange(v.length, v.length);
  };
  home.querySelectorAll('.card').forEach(c => c.onclick = () => navigate('?tool=' + c.dataset.id));
}

/* ================= フィールドHTML ================= */
function fieldHTML(f) {
  if (f.t === 'helper') return `<div class="tiny">${f.text}</div>`;

  if (f.t === 'toggle')
    return `<label class="tg"><span class="switch"><input type="checkbox" data-label="${f.label}"><span class="slider"></span></span><span>${f.label}</span></label>`;

  if (f.t === 'toggles')
    return `<div class="toggles">` + f.items.map(l =>
      `<label class="tg"><span class="switch"><input type="checkbox" data-label="${l}"><span class="slider"></span></span><span>${l}</span></label>`).join('') + `</div>`;

  if (f.t === 'nums')
    return `<div class="nums">` + f.items.map(n =>
      `<div class="nitem"><label>${n.label}</label><input type="number" data-label="${n.label}" value="${n.val ?? 0}"><span class="unit">${n.unit}</span></div>`).join('') + `</div>`;

  if (f.t === 'btn')
    return `<button type="button" class="btn-${f.style || 'sm'}" data-act="${f.act}">${f.label}</button>`;

  if (f.t === 'inlinebtn')
    return `<div class="field"><label>${f.label}</label><div class="inlinebtn"><input type="number" data-label="${f.label}" value="${f.val ?? 0}"><span class="unit">${f.unit || ''}</span><button type="button" class="btn-sm" data-act="${f.act}">${f.btn}</button></div></div>`;

  if (f.t === 'select') {
    const opts = `<option value="">-- 選択 --</option>` + f.options.map(o => `<option value="${o}">${o}</option>`).join('');
    return `<div class="field"><label>${f.label}</label><select data-label="${f.label}">${opts}</select></div>`;
  }

  const unit = f.unit ? `<span class="unit">${f.unit}</span>` : '';

  if (f.t === 'area') {
    const isToken = f.label === 'トークン';
    if (isToken) {
      return `<div class="field"><label>${f.label}</label>
        <div class="ta-wrap"><textarea data-label="${f.label}" rows="4" placeholder="${f.ph || ''}">${f.val || ''}</textarea>
        <button type="button" class="eye" data-eye aria-label="表示/非表示">${EYE_ON}${EYE_OFF}</button></div></div>`;
    }
    return `<div class="field"><label>${f.label}</label><textarea data-label="${f.label}" rows="3" placeholder="${f.ph || ''}">${f.val || ''}</textarea></div>`;
  }

  const input = f.t === 'num'
    ? `<input type="number" data-label="${f.label}" value="${f.val ?? 0}">`
    : `<input data-label="${f.label}" placeholder="${f.ph || ''}" value="${f.val || ''}">`;
  return `<div class="field"><label>${f.label}</label><div class="inline">${input}${unit}</div></div>`;
}

function renderForm(fields) {
  let html = '', open = false;
  const flush = () => { if (open) html += '</div></div>'; open = false; };
  for (const f of fields) {
    if (f.t === 'section') {
      flush();
      const cls = f.collapsed ? 'sec closed' : 'sec';
      html += `<div class="${cls}"><div class="sec-head"><span class="arrow">▼</span>${f.label}</div><div class="sec-body">`;
      open = true;
    } else html += fieldHTML(f);
  }
  flush();
  return html;
}

function renderButtons(t) {
  const btns = t.buttons || [{label:'実行',kind:'run',color:'dark'},{label:'停止',kind:'stop',color:'red'}];
  const mk = b => {
    const color = b.color || (b.kind === 'stop' ? 'red' : (b.kind === 'run' ? 'dark' : 'blue'));
    const id = b.kind === 'run' ? ' id="runBtn"' : (b.kind === 'stop' ? ' id="stopBtn"' : '');
    const act = b.act ? ` data-act="${b.act}"` : '';
    return `<button class="btn-b btn-${color}"${id}${act}>${b.label}</button>`;
  };
  if (t.buttonsRow) return `<div class="btn-row" style="margin-top:22px">${btns.map(mk).join('')}</div>`;
  const run = btns.find(b => b.kind === 'run');
  const rest = btns.filter(b => b.kind !== 'run');
  const runLabel = run ? run.label : '実行';
  return (run ? `<button class="btn-run" id="runBtn" style="background:var(--blurple)">${runLabel}</button>` : '') +
    (rest.length ? `<div class="btn-row">${rest.map(mk).join('')}</div>` : '');
}

function showTool(id) {
  const t = TOOLS.find(x => x.id === id);
  document.title = t.title;
  $('#home').classList.add('hidden');
  const view = $('#toolView');
  view.classList.remove('hidden');
  view.innerHTML = `
    <button class="back" id="backBtn">← ツール一覧</button>
    <h1 class="detail-title">${t.title}</h1>
    <p class="detail-desc">${t.desc}</p>
    <div class="form" id="toolForm">${renderForm(t.fields)}</div>
    ${renderButtons(t)}
    <div class="logbox" id="logBox"></div>`;

  $('#backBtn').onclick = () => navigate(location.pathname);
  const sb = $('#stopBtn'); if (sb) sb.onclick = () => { STOP = true; log('停止', 'warn'); };
  const rb = $('#runBtn'); if (rb) rb.onclick = async () => {
    STOP = false; rb.disabled = true;
    const v = collect(); log('実行開始', 'info');
    try { await t.run(v); log('実行終了', 'ok'); }
    catch (e) { log('エラー: ' + e.message, 'danger'); }
    rb.disabled = false;
  };

  view.querySelectorAll('.sec-head').forEach(h => h.onclick = () => h.parentElement.classList.toggle('closed'));
  view.querySelectorAll('[data-act]').forEach(b => b.onclick = () => handleBtn(b.dataset.act));
  view.querySelectorAll('[data-eye]').forEach(b => b.onclick = () => b.closest('.ta-wrap').classList.toggle('masked'));

  window.scrollTo(0, 0);
}

function collect() {
  const out = {};
  document.querySelectorAll('#toolForm [data-label]').forEach(el => {
    out[el.dataset.label] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return out;
}
function setVal(label, val) {
  const el = document.querySelector(`#toolForm [data-label="${label}"]`);
  if (el) el.value = val;
}
async function firstTextChannel(gid, tk) {
  const chs = await dapi(`/guilds/${gid}/channels`, tk);
  return chs.find(c => c.type === 0);
}

/* ================= ボタンアクション ================= */
async function handleBtn(act) {
  const v = collect();
  const tk = parseTokens(v['トークン'])[0];
  if (!tk) return log('トークンを入力してください', 'warn');

  if (act === 'fetchChannels' || act === 'fetchAllChannels') {
    const gid = v['サーバーID'];
    if (!gid) return log('サーバーIDを入力してください', 'warn');
    try {
      const chs = await dapi(`/guilds/${gid}/channels`, tk);
      setVal('チャンネルID', chs.filter(c => c.type === 0 || c.type === 5).map(c => c.id).join('\n'));
      log(`${act === 'fetchAllChannels' ? '全チャンネル' : 'チャンネル'} ${chs.length}件 取得`, 'ok');
    } catch (e) { log('取得失敗: ' + e.message, 'danger'); }
  }

  if (act === 'fetchMentions') {
    const ch = v['メンション取得用チャンネルID'] || parse(v['チャンネルID'])[0];
    if (!ch) return log('チャンネルIDが必要', 'warn');
    const ids = new Set(); let before;
    while (!STOP) {
      const batch = await dapi(`/channels/${ch}/messages?limit=100${before ? `&before=${before}` : ''}`, tk);
      if (!batch.length) break;
      batch.forEach(m => m.author && ids.add(m.author.id));
      before = batch[batch.length - 1].id;
      if (batch.length < 100) break;
    }
    setVal('メンションするユーザーID', [...ids].join('\n'));
    log(`メンション ${ids.size}人 取得`, 'ok');
  }

  if (act === 'fetchMessages') {
    const ch = v['チャンネルID'];
    if (!ch) return log('チャンネルIDが必要', 'warn');
    const uidf = (v['ユーザーID'] || '').trim();
    let batch = await dapi(`/channels/${ch}/messages?limit=${+v['取得件数'] || 20}`, tk);
    if (uidf) batch = batch.filter(m => m.author && m.author.id === uidf);
    if (!batch.length) return log('該当メッセージなし', 'warn');
    setVal('メッセージID', batch[0].id);
    log(`メッセージ取得: ${batch.length}件`, 'ok');
  }

  if (act === 'fetchGuilds') {
    try {
      const guilds = await dapi('/users/@me/guilds', tk);
      const sel = document.querySelector(`#toolForm [data-label="ギルドタグ"]`);
      if (sel) {
        sel.innerHTML = '<option value="">-- 選択 --</option>' +
          guilds.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
      }
      log(`サーバー ${guilds.length}件 取得`, 'ok');
    } catch (e) { log('取得失敗: ' + e.message, 'danger'); }
  }

  if (act === 'leaveGuild' || act === 'leaveServer') {
    const toks = parseTokens(v['トークン']);
    let gid = (v['サーバーID'] || '').trim();
    if (!gid) {
      const raw = v['招待リンク または サーバーID'] || '';
      const code = raw.includes('discord') ? raw.split('/').pop().split('?')[0] : raw;
      try { const inv = await dapi(`/invites/${code}`, toks[0]); gid = inv.guild?.id; } catch (e) {}
    }
    if (!gid) return log('サーバーIDを特定できません', 'warn');
    for (const t of toks) {
      try { await dapi(`/users/@me/guilds/${gid}`, t, { method: 'DELETE' }); log('退出', 'ok'); }
      catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }

  if (act === 'addToGroup') {
    if (!lastGroupId) return log('先にグループを作成してください', 'warn');
    for (const u of parse(v['ユーザーID'])) {
      try { await dapi(`/channels/${lastGroupId}/recipients/${u}`, tk, { method: 'PUT', body: '{}' }); log('追加: ' + u, 'ok'); }
      catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }

  if (act === 'leaveGroup') {
    const toks = parseTokens(v['トークン']);
    for (const t of toks) {
      try {
        const dms = await dapi('/users/@me/channels', t);
        const groups = dms.filter(c => c.type === 3);
        for (const g of groups) {
          await dapi(`/channels/${g.id}`, t, { method: 'DELETE' });
          log('退出: ' + (g.name || g.id), 'ok');
        }
        if (!groups.length) log('グループDMが見つかりません', 'warn');
      } catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }

  if (act === 'vcLeave') {
    for (const item of vcGateways) item.gw.send(4, { guild_id: v['サーバーID'], channel_id: null });
    log('VC退出', 'ok');
  }

  if (act === 'statusPreview') log('Preview: ' + JSON.stringify(buildActivity(v)), 'info');

  if (act === 'statusReset') {
    ['Activity Name','State','Details','Stream URL','Button 1 ラベル','Button 2 ラベル'].forEach(l => setVal(l, ''));
    ['Party Size','Party Max','Timestamps Start','Timestamps End'].forEach(l => setVal(l, 0));
    log('リセット', 'info');
  }
  if (act === 'statusStop') {
    if (statusGw) { statusGw.send(3, { status: 'invisible', activities: [], since: 0, afk: false }); statusGw.close(); statusGw = null; }
    log('Stop', 'ok');
  }
}

function mutate(s) {
  if (!s) return s;
  return s + ' ' + Math.random().toString(36).slice(2, 7);
}

const POLL_HOURS = { '1時間':1, '4時間':4, '8時間':8, '24時間':24, '3日':72, '1週間':168 };

async function runRaider(v) {
  const toks = parseTokens(v['トークン']);
  const chs = parse(v['チャンネルID']);
  const base = v['メッセージ内容'] || '';
  const delay = (+v['メッセージ送信間隔'] || 0) * 1000;
  const limit = +v['メッセージ送信上限'] || 0;
  const rand = v['メッセージのランダマイズ'];
  const everyone = v['全体メンション'];
  const pool = parse(v['メンションするユーザーID']);
  const mentionLimit = +v['メンション上限'] || 0;
  const randomMention = v['ランダムメンション'];
  const pollTitle = v['投票 タイトル'];
  const pollOpts = parse(v['投票 選択肢']);
  const pollEnd = v['即時終了'];
  const pollDuration = POLL_HOURS[v['開催期間']] || 24;
  const replyOn = v['リプライを有効にする'];
  const replyId = v['リプライ先メッセージ'];

  let n = 0;
  outer:
  for (const tk of toks) {
    for (const ch of chs) {
      if (STOP || (limit && n >= limit)) break outer;
      let prefix = '';
      if (everyone) prefix += '@everyone ';
      if (pool.length) {
        let pick;
        if (randomMention) {
          pick = [...pool].sort(() => Math.random() - 0.5).slice(0, mentionLimit || pool.length);
        } else {
          pick = mentionLimit ? pool.slice(0, mentionLimit) : pool;
        }
        prefix += pick.map(id => `<@${id}>`).join(' ') + ' ';
      }
      const content = prefix + (rand ? mutate(base) : base);
      const payload = { content };
      if (pollTitle && pollOpts.length)
        payload.poll = {
          question: { text: pollTitle },
          answers: pollOpts.map(o => ({ poll_media: { text: o } })),
          duration: pollDuration,
          allow_multiselect: false
        };
      if (replyOn && replyId) payload.message_reference = { message_id: replyId, type: 0 };
      try {
        const sent = await dapi(`/channels/${ch}/messages`, tk, { method: 'POST', body: JSON.stringify(payload) });
        n++;
        if (pollTitle && pollEnd && sent && sent.id)
          await dapi(`/channels/${ch}/polls/${sent.id}/expire`, tk, { method: 'POST' }).catch(() => {});
      } catch (e) { log('失敗: ' + e.message, 'danger'); }
      if (delay) await sleep(delay);
    }
  }
  log(`送信完了 (${n}件)`, 'ok');
}

/* ============ Joiner（429対応 + キャンセル機能） ============ */
async function runJoiner(v) {
  USE_PROXY = true;      // UIから外したので固定（プロキシ必須環境）
  const perWait = 3000;  // 1アカウントごとの待機（固定）
  const maxTry = 4;      // captcha最大試行（固定）

  const toks = parseTokens(v['トークン']);
  const raw = v['招待リンク または サーバーID'] || '';
  const code = raw.includes('discord') ? raw.split('/').pop().split('?')[0] : raw;
  const leave = v['参加後に自動退出'];
  const cancelOnFail = v['正常実行できない場合にキャンセルする'];
  let n = 0, skip = 0, gid = null, err10008 = 0;
  log('接続: ' + (USE_PROXY ? 'プロキシ経由' : 'Discordへ直接') + ' / アカウント間隔 ' + (perWait / 1000) + 's', 'info');

  for (const tk of toks) {
    if (STOP) break;
    const partial = tk.slice(0, 12) + '...';
    const sid = uid();
    let bad = 0, rateWaits = 0, tries = 0;

    // 事前チェック（キャンセル機能有効時のみ）
    if (cancelOnFail) {
      let okTok = true;
      try { await dapiRetry('/users/@me', tk); }
      catch (e) { log('スキップ(' + partial + ') トークン検証失敗: ' + e.message, 'warn'); skip++; okTok = false; }
      if (okTok) {
        try { await dapiRetry(`/invites/${code}?with_counts=true`, tk); }
        catch (e) { log('スキップ(' + partial + ') 招待コード検証失敗: ' + e.message, 'warn'); skip++; okTok = false; }
      }
      if (!okTok) continue;
    }

    let captcha = null, done = false;
    while (!STOP) {
      const r = await acceptInvite(tk, code, sid, captcha);

      if (r.ok) {
        n++;
        log('参加(' + partial + '): ' + (r.data.guild?.name || code), 'ok');
        if (leave && r.data.guild?.id) {
          await sleep(900);
          await dapi(`/users/@me/guilds/${r.data.guild.id}`, tk, { method: 'DELETE' });
          log('退出(' + partial + ')', 'info');
        }
        done = true;
        break;
      }

      // 403 / 10008（Unknown Message）→ 実参加を確認してリトライ
      if (r.status === 403 && r.body && (r.body.code === 10008 || /Unknown Message|不明なメッセージ/.test(r.body.message || ''))) {
        err10008++;
        log('403 Unknown Message(10008) → 実参加を確認します(' + partial + ') 確認' + err10008, 'warn');
        await sleep(1800);
        if (!gid) gid = await resolveGuildId(code, tk);
        if (await isInGuild(tk, gid)) {
          n++;
          log('参加(' + partial + '): 確認OK（10008は誤報でした）', 'ok');
          done = true;
          break;
        }
        if (err10008 >= 3) { log('10008が続くためキャンセル(' + partial + ')', 'warn'); skip++; break; }
        captcha = null;   // 新しいチャレンジで再挑戦
        await sleep(1200);
        continue;
      }

      if (r.status === 429) {
        if (++rateWaits > 5) { log('429が続くためキャンセル(' + partial + ')', 'warn'); skip++; break; }
        const w = Math.min(r.retryAfter || 2, 60);
        log('429 レート制限 → ' + w.toFixed(1) + 's 待機して再試行(' + partial + ')', 'warn');
        await sleep(w * 1000 + 400);
        continue;
      }
      if (r.status === 403) log('403: 権限/BANの可能性(' + partial + ')', 'warn');
      rateWaits = 0;

      if (r.body && r.body.captcha_sitekey) {
        tries++;
        if (tries > maxTry) { log('captcha試行上限でキャンセル(' + partial + ')', 'warn'); skip++; break; }
        const ck = JSON.stringify(r.body.captcha_key || '');
        log('captcha応答: ' + ck +
            ' / invisible=' + !!r.body.should_serve_invisible +
            ' / session=' + (r.body.captcha_session_id ? '有' : '無') +
            ' / rqtoken=' + (r.body.captcha_rqtoken ? '有' : '無'), 'warn');
        if (ck.includes('invalid-response')) {
          bad++;
          if (bad >= 2 && cancelOnFail) { log('invalid-response が続くためキャンセル(' + partial + ')', 'warn'); skip++; break; }
        }
        log('captcha要求(' + partial + ') 試行' + tries + ' → hCaptchaを解いてください', 'warn');
        let token;
        try {
          token = await solveCaptcha(r.body.captcha_sitekey, r.body.captcha_rqdata, {
            invisible: !!r.body.should_serve_invisible,
            host: 'discord.com'
          });
        } catch (e) { log('captcha解決失敗(' + partial + '): ' + e.message, 'danger'); skip++; break; }
        log('hCaptchaトークン取得 (len=' + (token ? token.length : 0) + ')', token ? 'info' : 'warn');
        captcha = {
          key: token,
          rqtoken: r.body.captcha_rqtoken,
          rqdata: r.body.captcha_rqdata,
          sessionId: r.body.captcha_session_id
        };
        await sleep(300);
        continue;
      }
      log('失敗(' + partial + '): HTTP ' + (r.status || '') + ' :: ' + JSON.stringify(r.body || r.netError), 'danger');
      break;
    }
    if (done) await sleep(perWait);
  }
  log(`完了 (参加 ${n}人 / スキップ ${skip}人)`, 'ok');
}

function buildActivity(v) {
  const typeNum = { Playing: 0, Streaming: 1, Listening: 2, Watching: 3, Competing: 5, Custom: 4 }[v['Activity Type']] ?? 0;
  const name = v['Activity Name'] || '';
  const a = { name: typeNum === 4 ? 'Custom Status' : (name || '...'), type: typeNum };
  if (typeNum === 4) { a.state = name; return a; }
  if (typeNum === 1 && v['Stream URL']) a.url = v['Stream URL'];
  if (v['State']) a.state = v['State'];
  if (v['Details']) a.details = v['Details'];
  if (+v['Party Size'] || +v['Party Max']) a.party = { size: [+v['Party Size'] || 0, +v['Party Max'] || 0] };
  const ts = {};
  if (+v['Timestamps Start']) ts.start = +v['Timestamps Start'] * 1000;
  if (+v['Timestamps End']) ts.end = +v['Timestamps End'] * 1000;
  if (Object.keys(ts).length) a.timestamps = ts;
  if (v['Action Button']) { const b = [v['Button 1 ラベル'], v['Button 2 ラベル']].filter(Boolean); if (b.length) a.buttons = b; }
  return a;
}

async function runStatusStart(v) {
  const toks = parseTokens(v['トークン']);
  const actObj = buildActivity(v);
  const first = toks[0];
  try { statusGw = await connectGateway(first); } catch (e) { return log('接続失敗: ' + e.message, 'danger'); }
  statusGw.send(3, { status: 'online', activities: [actObj], since: 0, afk: false });
  log('Start: ' + JSON.stringify(actObj), 'ok');
}

async function runSlash(v) {
  const toks = parseTokens(v['トークン']);
  const ch = v['チャンネルID'];
  const name = (v['コマンド名'] || '').replace(/^\//, '');
  const count = +v['実行回数'] || 1;
  if (!ch) return log('チャンネルIDが必要', 'warn');
  const chan = await dapi(`/channels/${ch}`, toks[0]);
  const idx = await dapi(`/guilds/${chan.guild_id}/application-command-index`, toks[0]);
  const cmd = (idx.application_commands || []).find(c => c.name === name);
  if (!cmd) return log('コマンドが見つかりません: ' + name, 'warn');
  for (let i = 0; i < count && !STOP; i++) {
    for (const t of toks) {
      try {
        const gw = await connectGateway(t);
        await dapi('/interactions', t, { method: 'POST', body: JSON.stringify({
          type: 2, application_id: cmd.application_id, guild_id: chan.guild_id, channel_id: ch,
          session_id: gw.sessionId,
          data: { version: cmd.version, id: cmd.id, name: cmd.name, type: 1, options: [], application_command: cmd },
          nonce: uid()
        })});
        gw.close(); log('実行', 'ok');
      } catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }
}

async function runReport(v) {
  const toks = parseTokens(v['トークン']);
  const ch = v['チャンネルID'], mid = v['メッセージID'];
  const reportType = Math.max(0, REPORT_TYPES.indexOf(v['通報タイプ']));
  const chan = await dapi(`/channels/${ch}`, toks[0]);
  for (const t of toks) {
    if (STOP) break;
    try {
      await dapi('/reports', t, { method: 'POST', body: JSON.stringify({
        channel_id: ch, message_id: mid, guild_id: chan.guild_id, report_type: reportType
      })});
      log('通報', 'ok');
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
}

async function runButton(v) {
  const toks = parseTokens(v['トークン']);
  const ch = v['チャンネルID'], mid = v['メッセージID'];
  const nums = parse(v['ボタン番号']).map(Number);
  const count = +v['クリック回数'] || 1;
  const msg = await dapi(`/channels/${ch}/messages/${mid}`, toks[0]);
  const comps = (msg.components || []).flatMap(r => r.components || []);
  const targets = nums.length ? comps.filter((c, i) => nums.includes(i + 1)) : comps.filter(c => c.type === 2 || c.type === 3);
  for (let i = 0; i < count && !STOP; i++) {
    for (const tk of toks) {
      for (const c of targets) {
        try {
          const body = c.type === 3
            ? { type: 3, custom_id: c.custom_id, values: [c.options?.[0]?.value].filter(Boolean) }
            : { type: 2, custom_id: c.custom_id };
          await dapi(`/interactions`, tk, { method: 'POST', body: JSON.stringify({
            type: 3, guild_id: v['サーバーID'], channel_id: ch, message_id: mid, session_id: uid(), data: body
          })});
        } catch (e) {}
      }
    }
  }
  log('クリック完了', 'ok');
}

/* ================= ヘルパー（10008対策） ================= */
async function resolveGuildId(code, tk) {
  try { const inv = await dapiRetry(`/invites/${code}?with_counts=true`, tk); return inv.guild?.id; }
  catch (e) { return null; }
}
async function isInGuild(tk, gid) {
  if (!gid) return false;
  try { const gs = await dapiRetry('/users/@me/guilds', tk); return Array.isArray(gs) && gs.some(g => g.id === gid); }
  catch (e) { return false; }
}

route();
