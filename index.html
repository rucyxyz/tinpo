const BASE = 'https://discord.com/api/v10';
let STOP = false;

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const parse = s => (s || '').split(/[\s,]+/).filter(Boolean);
const uid = () => Math.floor(Math.random() * 1e16).toString();

async function dapi(path, token, opts = {}) {
  const res = await fetch(BASE + path, {
    ...opts,
    headers: { 'Authorization': token, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (res.status === 429) {
    const d = await res.json().catch(() => ({}));
    await sleep((d.retry_after || 1) * 1000 + 60);
    return dapi(path, token, opts);
  }
  if (res.status === 204) return null;
  if (!res.ok) {
    let m = 'HTTP ' + res.status;
    try { const d = await res.json(); m = d.message || m; } catch (e) {}
    throw new Error(m);
  }
  return res.json();
}

function log(msg, type = 'info') {
  const box = $('#logBox');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'log-line ' + type;
  el.textContent = `[${new Date().toLocaleTimeString('ja-JP')}] ${msg}`;
  box.prepend(el);
}

function connectGateway(token) {
  return new Promise((resolve, reject) => {
    let ws;
    try { ws = new WebSocket('wss://gateway.discord.gg/?v=10&encoding=json'); }
    catch (e) { return reject(e); }
    const gw = { ws, token, seq: null, hb: null, guilds: [] };
    const to = setTimeout(() => reject(new Error('Gateway timeout')), 15000);
    ws.onmessage = ev => {
      const p = JSON.parse(ev.data);
      if (p.op === 10) {
        gw.hb = setInterval(() => ws.send(JSON.stringify({ op: 1, d: gw.seq })), p.d.heartbeat_interval);
        ws.send(JSON.stringify({ op: 2, d: {
          token, capabilities: 125, compress: false,
          properties: { os: 'Windows', browser: 'Chrome', device: 'desktop', system_locale: 'ja-JP' }
        }}));
      } else if (p.op === 0) {
        gw.seq = p.s;
        if (p.t === 'READY') { gw.sessionId = p.d.session_id; gw.user = p.d.user; clearTimeout(to); resolve(gw); }
        else if (p.t === 'GUILD_CREATE') gw.guilds.push(p.d);
      }
    };
    ws.onerror = () => { clearTimeout(to); reject(new Error('Gateway接続失敗')); };
    ws.onclose = () => clearInterval(gw.hb);
    gw.send = (op, d) => ws.send(JSON.stringify({ op, d }));
    gw.close = () => { clearInterval(gw.hb); try { ws.close(); } catch (e) {} };
  });
}

/* ================= ルーター ================= */
function route() {
  const id = location.hash.replace(/^#\/?/, '');
  if (!id || !TOOLS.some(t => t.id === id)) showHome();
  else showTool(id);
}
window.addEventListener('hashchange', route);

/* ================= 一覧 ================= */
function showHome(q = '') {
  document.title = 'ツール一覧';
  $('#toolView').classList.add('hidden');
  const home = $('#home');
  home.classList.remove('hidden');
  const list = TOOLS.filter(t => (t.title + t.desc).toLowerCase().includes(q.toLowerCase()));
  home.innerHTML =
    `<h1 class="page-title">ツール一覧</h1>
     <div class="search"><input id="search" placeholder="ツールを検索..." value="${q}"></div>
     <div class="cards">` +
    (list.length ? list.map(t => `<div class="card" data-id="${t.id}">
        <div class="card-icon">${ICONS[t.icon] || ''}</div>
        <div class="card-body"><div class="card-title">${t.title}</div><div class="card-desc">${t.desc}</div></div>
      </div>`).join('') : `<div class="empty">該当するツールがありません</div>`) +
    `</div>`;
  const s = $('#search');
  s.oninput = () => {
    const v = s.value; showHome(v);
    const ns = $('#search'); ns.focus(); ns.setSelectionRange(v.length, v.length);
  };
  home.querySelectorAll('.card').forEach(c => c.onclick = () => { location.hash = '#/' + c.dataset.id; });
}

/* ================= 詳細 ================= */
function fieldHTML(f) {
  if (f.t === 'helper') return `<div class="helper">${f.text}</div>`;
  if (f.t === 'toggle')
    return `<label class="tg"><span class="switch"><input type="checkbox" data-label="${f.label}"><span class="slider"></span></span><span>${f.label}</span></label>`;
  if (f.t === 'toggles')
    return `<div class="toggles">` + f.items.map(l =>
      `<label class="tg"><span class="switch"><input type="checkbox" data-label="${l}"><span class="slider"></span></span><span>${l}</span></label>`).join('') + `</div>`;
  if (f.t === 'nums')
    return `<div class="nums">` + f.items.map(n =>
      `<div class="nitem"><label>${n.label}</label><input type="number" data-label="${n.label}" value="${n.val ?? 0}"><span class="unit">${n.unit}</span></div>`).join('') + `</div>`;
  if (f.t === 'btn')
    return `<button class="${f.style === 'full' ? 'btn-full' : 'btn-sm'}" data-act="${f.act}" style="align-self:flex-start">${f.label}</button>`;
  if (f.t === 'inlinebtn')
    return `<div class="inlinebtn"><label>${f.label}</label><input type="number" data-label="${f.label}" value="${f.val ?? 0}"><span class="unit">${f.unit}</span><button class="btn-sm" data-act="${f.act}">${f.btn}</button></div>`;
  if (f.t === 'select') {
    const ph = f.ph ? `<option value="" disabled selected>${f.ph}</option>` : '';
    const opts = ph + (f.options || []).map(o => `<option>${o}</option>`).join('');
    return `<div class="field"><label>${f.label}</label><select data-label="${f.label}">${opts}</select></div>`;
  }
  const unit = f.unit ? `<span class="unit">${f.unit}</span>` : '';
  const input = f.t === 'area'
    ? `<textarea data-label="${f.label}" rows="3" placeholder="${f.ph || ''}">${f.val || ''}</textarea>`
    : f.t === 'num'
      ? `<input type="number" data-label="${f.label}" value="${f.val ?? 0}">`
      : `<input data-label="${f.label}" placeholder="${f.ph || ''}" value="${f.val || ''}">`;
  return `<div class="field"><label>${f.label}</label><div class="inline">${input}${unit}</div></div>`;
}

function renderForm(fields) {
  let html = '', open = false;
  const flush = () => { if (open) html += '</div></div>'; };
  for (const f of fields) {
    if (f.t === 'section') {
      flush();
      html += `<div class="sec"><div class="sec-head"><span class="arrow">▼</span>${f.label}</div><div class="sec-body">`;
      open = true;
    } else html += fieldHTML(f);
  }
  flush();
  return html;
}

function renderButtons(t) {
  const btns = t.buttons || [{label:'実行',kind:'run',color:'dark'},{label:'停止',kind:'stop',color:'red'}];
  const mk = b => {
    const color = b.color || (b.kind === 'stop' ? 'red' : (b.kind === 'run' ? 'dark' : 'blue'));
    const id = b.kind === 'run' ? ' id="runBtn"' : (b.kind === 'stop' ? ' id="stopBtn"' : '');
    const act = b.act ? ` data-act="${b.act}"` : '';
    return `<button class="btn-b btn-${color}"${id}${act}>${b.label}</button>`;
  };
  if (t.buttonsRow) return `<div class="btn-row" style="margin-top:22px">${btns.map(mk).join('')}</div>`;
  const run = btns.find(b => b.kind === 'run');
  const rest = btns.filter(b => b.kind !== 'run');
  return (run ? `<button class="btn-run" id="runBtn">${run.label}</button>` : '') +
    (rest.length ? `<div class="btn-row">${rest.map(mk).join('')}</div>` : '');
}

function showTool(id) {
  const t = TOOLS.find(x => x.id === id);
  document.title = t.title;
  $('#home').classList.add('hidden');
  const view = $('#toolView');
  view.classList.remove('hidden');
  view.innerHTML = `
    <button class="back" id="backBtn">← ツール一覧</button>
    <h1 class="detail-title">${t.title}</h1>
    <p class="detail-desc">${t.desc}</p>
    <div class="form" id="toolForm">${renderForm(t.fields)}</div>
    ${renderButtons(t)}
    <div class="logbox" id="logBox"></div>`;

  $('#backBtn').onclick = () => { location.hash = '#/'; };
  const sb = $('#stopBtn'); if (sb) sb.onclick = () => { STOP = true; log('停止', 'warn'); };
  const rb = $('#runBtn'); if (rb) rb.onclick = async () => {
    STOP = false; rb.disabled = true;
    const v = collect(); log('実行開始', 'info');
    try { await t.run(v); log('実行終了', 'ok'); }
    catch (e) { log('エラー: ' + e.message, 'danger'); }
    rb.disabled = false;
  };
  view.querySelectorAll('.sec-head').forEach(h => h.onclick = () => h.parentElement.classList.toggle('closed'));
  view.querySelectorAll('[data-act]').forEach(b => b.onclick = () => handleBtn(b.dataset.act));
  window.scrollTo(0, 0);
}

function collect() {
  const out = {};
  document.querySelectorAll('#toolForm [data-label]').forEach(el => {
    out[el.dataset.label] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return out;
}
function setVal(label, val) {
  const el = document.querySelector(`#toolForm [data-label="${label}"]`);
  if (el) el.value = val;
}
async function firstTextChannel(gid, tk) {
  const chs = await dapi(`/guilds/${gid}/channels`, tk);
  return chs.find(c => c.type === 0);
}

/* ================= ボタンアクション ================= */
async function handleBtn(act) {
  const v = collect();
  const tk = parse(v['トークン'])[0];
  if (!tk) return log('トークンを入力してください', 'warn');

  if (act === 'fetchChannels') {
    const gid = v['サーバーID'];
    if (!gid) return log('サーバーIDを入力してください', 'warn');
    try {
      const chs = await dapi(`/guilds/${gid}/channels`, tk);
      setVal('チャンネルID', chs.filter(c => c.type === 0 || c.type === 5).map(c => c.id).join('\n'));
      log('チャンネル取得', 'ok');
    } catch (e) { log('取得失敗: ' + e.message, 'danger'); }
  }

  if (act === 'fetchAllChannels') {
    const gid = v['サーバーID'];
    if (!gid) return log('サーバーIDを入力してください', 'warn');
    try {
      const chs = await dapi(`/guilds/${gid}/channels`, tk);
      setVal('チャンネルID', chs.filter(c => c.type === 0 || c.type === 5).map(c => c.id).join('\n'));
      log(`全チャンネル ${chs.length}件 取得`, 'ok');
    } catch (e) { log('取得失敗: ' + e.message, 'danger'); }
  }

  if (act === 'fetchMentions' || act === 'fetchAllMentions') {
    const ch = v['メンション取得用チャンネルID'] || parse(v['チャンネルID'])[0];
    if (!ch) return log('チャンネルIDが必要', 'warn');
    const n = act === 'fetchAllMentions' ? 0 : (+v['取得する人数'] || 100);
    const ids = new Set(); let before;
    while (!STOP) {
      if (n && ids.size >= n) break;
      const q = n ? Math.min(100, n - ids.size) : 100;
      const batch = await dapi(`/channels/${ch}/messages?limit=${q}${before ? `&before=${before}` : ''}`, tk);
      if (!batch.length) break;
      batch.forEach(m => m.author && ids.add(m.author.id));
      before = batch[batch.length - 1].id;
      if (batch.length < q || !n) break;
    }
    setVal('メンションするユーザーID', [...ids].join('\n'));
    log(`メンション ${ids.size}件 取得`, 'ok');
  }

  if (act === 'fetchHistory') {
    const ch = parse(v['チャンネルID'])[0];
    if (!ch) return log('チャンネルIDが必要', 'warn');
    const batch = await dapi(`/channels/${ch}/messages?limit=${+v['取得件数'] || 20}`, tk);
    const sel = document.querySelector(`#toolForm [data-label="リプライ先メッセージ（手動選択）"]`);
    sel.innerHTML = `<option value="">-- 選択してください --</option>` +
      batch.map(m => `<option value="${m.id}">${(m.author?.username || '?')}: ${(m.content || '').slice(0, 40) || '[添付]'}</option>`).join('');
    log(`履歴 ${batch.length}件 取得`, 'ok');
  }

  if (act === 'fetchMessages') {
    const ch = v['チャンネルID'];
    if (!ch) return log('チャンネルIDが必要', 'warn');
    const uidf = (v['ユーザーID'] || '').trim();
    let batch = await dapi(`/channels/${ch}/messages?limit=${+v['取得件数'] || 20}`, tk);
    if (uidf) batch = batch.filter(m => m.author && m.author.id === uidf);
    if (!batch.length) return log('該当メッセージなし', 'warn');
    setVal('メッセージID', batch[0].id);
    log(`メッセージ取得: ${batch.length}件 (最新をIDにセット)`, 'ok');
  }

  if (act === 'leaveGuild' || act === 'leaveServer') {
    const toks = parse(v['トークン']);
    let gid = (v['サーバーID'] || '').trim();
    if (!gid) {
      const raw = v['招待リンク または サーバーID'] || '';
      const code = raw.includes('discord') ? raw.split('/').pop().split('?')[0] : raw;
      try { const inv = await dapi(`/invites/${code}`, toks[0]); gid = inv.guild?.id; } catch (e) {}
    }
    if (!gid) return log('サーバーIDを特定できません', 'warn');
    for (const t of toks) {
      try { await dapi(`/users/@me/guilds/${gid}`, t, { method: 'DELETE' }); log('退出', 'ok'); }
      catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }

  if (act === 'addToGroup') {
    if (!lastGroupId) return log('先にグループを作成してください', 'warn');
    for (const u of parse(v['ユーザーID'])) {
      try { await dapi(`/channels/${lastGroupId}/recipients/${u}`, tk, { method: 'PUT', body: '{}' }); log('追加: ' + u, 'ok'); }
      catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }

  if (act === 'vcLeave') {
    for (const item of vcGateways) item.gw.send(4, { guild_id: v['サーバーID'], channel_id: null });
    log('VC退出', 'ok');
  }

  if (act === 'statusPreview') {
    const actObj = buildActivity(v);
    log('Preview: ' + JSON.stringify(actObj), 'info');
  }
  if (act === 'statusReset') {
    ['Activity Name','State','Details','Stream URL','Button 1 ラベル','Button 2 ラベル'].forEach(l => setVal(l, ''));
    ['Party Size','Party Max','Timestamps Start','Timestamps End'].forEach(l => setVal(l, 0));
    log('リセット', 'info');
  }
  if (act === 'statusStop') {
    if (statusGw) { statusGw.send(3, { status: 'invisible', activities: [], since: 0, afk: false }); statusGw.close(); statusGw = null; }
    log('Stop', 'ok');
  }
}

/* ================= 各ツール ================= */
async function runTokenChecker(v) {
  const toks = parse(v['トークン']);
  let ok = 0, bad = 0, nitro = 0, lim = 0;
  for (const t of toks) {
    try {
      const u = await dapi('/users/@me', t);
      if (u.premium_type && u.premium_type > 0) { log('ニトロ: ' + u.username, 'ok'); nitro++; }
      else log('有効: ' + u.username + (v['アカウント情報を表示'] ? ` (ID:${u.id})` : ''), 'ok');
      ok++;
    } catch (e) {
      if (/429|rate/i.test(e.message)) { log('制限: ' + t.slice(0, 12), 'warn'); lim++; }
      else { log('無効: ' + t.slice(0, 12), 'danger'); bad++; }
    }
  }
  log(`結果 → 有効 ${ok} / 無効 ${bad} / ニトロ ${nitro} / 制限 ${lim}`, 'info');
}

async function runReaction(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'];
  const emojis = (v['絵文字'] || '🔥').split('.').map(s => s.trim()).filter(Boolean).map(encodeURIComponent);
  const count = +v['回数'] || 1, delay = +v['間隔'] || 0;
  let mid = v['メッセージID'];
  if (!mid) {
    const msgs = await dapi(`/channels/${ch}/messages?limit=1`, toks[0]);
    if (!msgs.length) return log('メッセージがありません', 'warn');
    mid = msgs[0].id;
  }
  for (let i = 0; i < count && !STOP; i++) {
    for (const tk of toks) {
      for (const emoji of emojis) {
        try {
          await dapi(`/channels/${ch}/messages/${mid}/reactions/${emoji}/@me`, tk, { method: 'PUT' });
          await dapi(`/channels/${ch}/messages/${mid}/reactions/${emoji}/@me`, tk, { method: 'DELETE' });
        } catch (e) {}
      }
    }
    if (delay) await sleep(delay);
  }
}

function mutate(s, adv) {
  if (!s) return s;
  if (adv) return s.split('').map(c => Math.random() < 0.25 ? c.toUpperCase() : c).join('') + '\u200b'.repeat(1 + Math.floor(Math.random() * 3));
  return s + ' ' + Math.random().toString(36).slice(2, 7);
}

async function resolveOnboarding(tokens, guildId) {
  for (const tk of tokens) {
    if (STOP) break;
    let gw;
    try { gw = await connectGateway(tk); } catch (e) { log('接続失敗: ' + e.message, 'danger'); continue; }
    let guild = null;
    for (let i = 0; i < 40 && !guild; i++) { guild = gw.guilds.find(g => g.id === guildId); if (!guild) await sleep(200); }
    if (!guild) { log('サーバー情報を取得できませんでした', 'warn'); gw.close(); continue; }
    try {
      const ob = guild.onboarding;
      if (ob && ob.prompts && ob.prompts.length) {
        const prompts = ob.prompts.map(p => ({ id: p.id, options: p.options.map(o => o.id), completed: true, in_onboarding: true, type: p.type }));
        await dapi(`/guilds/${guildId}/onboarding`, tk, { method: 'PUT', body: JSON.stringify({ prompts, default_channel_ids: ob.default_channel_ids || [], enabled: true, mode: ob.mode ?? 0 }) });
        log('オンボーディング解決', 'ok');
      }
      const ms = guild.membership_screening;
      if (ms && ms.form_fields && ms.form_fields.length) {
        const fields = {};
        ms.form_fields.forEach(f => { fields[f.field_type] = (f.values && f.values[0]) || f.value || ''; });
        await dapi(`/guilds/${guildId}/requests/@me`, tk, { method: 'PUT', body: JSON.stringify({ form_fields: fields, version: ms.version }) });
        log('認証解決', 'ok');
      }
    } catch (e) { log('オンボーディング失敗: ' + e.message, 'danger'); }
    gw.close();
  }
}

async function runRaider(v) {
  const toks = parse(v['トークン']);
  const guildId = v['サーバーID'];
  const chs = parse(v['チャンネルID']);
  const base = v['メッセージ内容'] || '';
  const delay = (+v['メッセージ送信間隔'] || 0) * 1000;
  const limit = +v['メッセージ送信上限'] || 0;
  const rand = v['メッセージのランダマイズ'];
  const adv = v['高度なランダマイズ'];
  const pool = parse(v['メンションするユーザーID']);
  const randN = +v['ランダムメンションする人数'] || 0;
  const pollTitle = v['投票 タイトル'];
  const pollOpts = parse(v['投票 選択肢']);
  const pollEnd = v['投票を強制終了'];
  const fwd = (v['転送するメッセージURL'] || '').trim();
  const replyOn = v['リプライを有効にする'];
  const replyId = v['リプライ先メッセージ（手動選択）'];

  if (v['オンボーディング & 認証を自動解決'] && guildId) { log('オンボーディング / 認証を解決中...', 'info'); await resolveOnboarding(toks, guildId); }

  let n = 0;
  outer:
  for (const tk of toks) {
    for (const ch of chs) {
      if (STOP || (limit && n >= limit)) break outer;
      let mentions = '';
      if (pool.length) {
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        const pick = randN ? shuffled.slice(0, randN) : shuffled;
        mentions = pick.map(id => `<@${id}>`).join(' ');
      }
      const content = (mentions ? mentions + ' ' : '') + (rand || adv ? mutate(base, adv) : base);
      const payload = { content };
      if (pollTitle && pollOpts.length)
        payload.poll = { question: { text: pollTitle }, answers: pollOpts.map(o => ({ poll_media: { text: o } })), duration: 24, allow_multiselect: false };
      if (fwd) {
        if (fwd.includes('/')) { const p = fwd.split('/'); const mid = p.pop(), cid = p.pop(); payload.message_reference = { message_id: mid, channel_id: cid, type: 1 }; }
        else payload.message_reference = { message_id: fwd, channel_id: chs[0], type: 1 };
      } else if (replyOn && replyId) payload.message_reference = { message_id: replyId, type: 0 };
      try {
        const sent = await dapi(`/channels/${ch}/messages`, tk, { method: 'POST', body: JSON.stringify(payload) });
        n++;
        if (pollTitle && pollEnd && sent && sent.id) await dapi(`/channels/${ch}/polls/${sent.id}/expire`, tk, { method: 'POST' }).catch(() => {});
      } catch (e) { log('失敗: ' + e.message, 'danger'); }
      if (delay) await sleep(delay);
    }
  }
  log(`送信完了 (${n}件)`, 'ok');
}

async function runInvite(v) {
  const toks = parse(v['トークン']);
  const gid = v['サーバーID'];
  const count = +v['生成数'] || 0;
  const inf = v['無限に生成'];
  const ch = (await firstTextChannel(gid, toks[0]))?.id;
  if (!ch) return log('チャンネルが見つかりません', 'warn');
  let i = 0;
  while (!STOP && (inf || i < count)) {
    for (const tk of toks) {
      try { const r = await dapi(`/channels/${ch}/invites`, tk, { method: 'POST', body: '{}' }); log('discord.gg/' + r.code, 'ok'); }
      catch (e) { log('失敗: ' + e.message, 'danger'); }
      i++;
    }
  }
}

async function runWebhook(v) {
  const toks = parse(v['トークン']);
  const gid = v['サーバーID'];
  const content = v['メッセージ内容'] || '';
  const count = +v['送信回数'] || 1;
  const ch = (await firstTextChannel(gid, toks[0]))?.id;
  if (!ch) return log('チャンネルが見つかりません', 'warn');
  for (const tk of toks) {
    let wh;
    try { wh = await dapi(`/channels/${ch}/webhooks`, tk, { method: 'POST', body: JSON.stringify({ name: v['Webhook Name'] || 'Captain Hook' }) }); }
    catch (e) { log('Webhook作成失敗: ' + e.message, 'danger'); continue; }
    for (let i = 0; i < count && !STOP; i++) {
      try { await dapi(`/webhooks/${wh.id}/${wh.token}`, tk, { method: 'POST', body: JSON.stringify({ content }) }); }
      catch (e) { log('送信失敗: ' + e.message, 'danger'); }
    }
    if (v['終了後にWebhookを削除']) await dapi(`/webhooks/${wh.id}`, tk, { method: 'DELETE' }).catch(() => {});
  }
  log('完了', 'ok');
}

async function runJoiner(v) {
  const toks = parse(v['トークン']);
  const raw = v['招待リンク または サーバーID'] || '';
  const code = raw.includes('discord') ? raw.split('/').pop().split('?')[0] : raw;
  const leave = v['参加後に自動退出'];
  let n = 0;
  for (const tk of toks) {
    if (STOP) break;
    try {
      const g = await dapi(`/invites/${code}`, tk, { method: 'POST', body: '{}' });
      n++; log('参加: ' + (g.guild?.name || code), 'ok');
      if (leave && g.guild?.id) await dapi(`/users/@me/guilds/${g.guild.id}`, tk, { method: 'DELETE' });
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
  log(`完了 (${n}人)`, 'ok');
}

async function runProfile(v) {
  const toks = parse(v['トークン']);
  const name = v['表示名'], bio = v['自己紹介'], url = v['アイコン画像URL'], cstatus = v['カスタムステータス'];
  const gid = v['サーバーID（ニックネーム用）'], nick = v['ニックネーム'];
  const tagGid = v['ギルドタグ サーバーID'], tag = v['ギルドタグ 文字列'];
  let dataUri;
  if (url) { const blob = await (await fetch(url)).blob(); dataUri = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); }
  for (const tk of toks) {
    if (STOP) break;
    try {
      const body = {};
      if (name) body.global_name = name;
      if (bio) body.bio = bio;
      if (dataUri) body.avatar = dataUri;
      if (tagGid && tag) body.clan = { identity_guild_id: tagGid, identity_enabled: true, tag };
      if (Object.keys(body).length) await dapi('/users/@me', tk, { method: 'PATCH', body: JSON.stringify(body) });
      if (gid && nick) await dapi(`/guilds/${gid}/members/@me`, tk, { method: 'PATCH', body: JSON.stringify({ nick }) });
      if (cstatus) {
        const gw = await connectGateway(tk);
        gw.send(3, { status: 'online', activities: [{ name: 'Custom Status', type: 4, state: cstatus }], since: 0, afk: false });
        await sleep(400); gw.close();
      }
      log('更新', 'ok');
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
}

async function runThread(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'], name = v['スレッド名'] || 'thread', count = +v['作成数'] || 1;
  for (let i = 0; i < count && !STOP; i++) {
    for (const tk of toks) {
      try { await dapi(`/channels/${ch}/threads`, tk, { method: 'POST', body: JSON.stringify({ name: `${name}-${i + 1}`, type: 11 }) }); log('作成 ' + (i + 1), 'ok'); }
      catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }
}

async function runGroup(v) {
  const toks = parse(v['トークン']);
  const users = parse(v['ユーザーID']);
  const content = v['メッセージ内容'] || '';
  const count = +v['送信回数'] || 1;
  const gname = v['グループ名'], url = v['アイコン画像URL'];
  let icon;
  if (url) { const blob = await (await fetch(url)).blob(); icon = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); }
  for (const tk of toks) {
    if (STOP) break;
    try {
      const body = { recipients: users };
      if (gname) body.name = gname;
      if (icon) body.icon = icon;
      const g = await dapi('/channels', tk, { method: 'POST', body: JSON.stringify(body) });
      lastGroupId = g.id;
      for (let i = 0; i < count && !STOP; i++)
        await dapi(`/channels/${g.id}/messages`, tk, { method: 'POST', body: JSON.stringify({ content }) }).catch(() => {});
      log('グループ作成: ' + (gname || g.id), 'ok');
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
}

async function runDmSpammer(v) {
  const toks = parse(v['トークン']);
  const gid = v['サーバーID'];
  let users = parse(v['ユーザーID']);
  const content = v['DMメッセージ'] || '';
  if (gid) {
    try {
      const members = await fetchMembers(gid, toks[0]);
      users = members;
      log(`メンバー ${users.length}人 取得`, 'info');
    } catch (e) { log('メンバー取得失敗: ' + e.message, 'danger'); }
  }
  for (const tk of toks) {
    for (const u of users) {
      if (STOP) break;
      try {
        if (v['フレンド申請を送る']) await dapi(`/users/@me/relationships/${u}`, tk, { method: 'PUT', body: '{}' });
        if (v['DMを送る']) {
          const dm = await dapi('/users/@me/channels', tk, { method: 'POST', body: JSON.stringify({ recipient_id: u }) });
          await dapi(`/channels/${dm.id}/messages`, tk, { method: 'POST', body: JSON.stringify({ content }) });
        }
      } catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }
}

async function fetchMembers(gid, tk) {
  const ids = []; let after = '0';
  while (!STOP) {
    const batch = await dapi(`/guilds/${gid}/members?limit=1000&after=${after}`, tk);
    if (!batch.length) break;
    batch.forEach(m => { if (!m.user?.bot) ids.push(m.user.id); });
    after = batch[batch.length - 1].user.id;
    if (batch.length < 1000) break;
  }
  return ids;
}

async function runHypeSquad(v) {
  const toks = parse(v['トークン']);
  const map = { Bravery: 1, Brilliance: 2, Balance: 3 };
  const house = map[v['ハウス']];
  for (const tk of toks) {
    if (STOP) break;
    try {
      if (house) { await dapi('/hypesquad/hypesquad-online', tk, { method: 'POST', body: JSON.stringify({ house_id: house }) }); log('変更', 'ok'); }
      else { await dapi('/hypesquad/hypesquad-online', tk, { method: 'DELETE' }); log('None', 'ok'); }
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
}

async function runVc(v) {
  const toks = parse(v['トークン']);
  const gid = v['サーバーID'], ch = v['ボイスチャンネルID'], count = +v['繰り返し回数'] || 1;
  const loop = v['繰り返し（参加⇄退出を連打）'];
  if (vcGateways.length !== toks.length) {
    vcGateways.forEach(i => i.gw.close());
    vcGateways = [];
    for (const t of toks) { try { vcGateways.push({ token: t, gw: await connectGateway(t) }); } catch (e) { log('接続失敗: ' + e.message, 'danger'); } }
  }
  log('Gateway接続: ' + vcGateways.length, 'info');
  if (loop) {
    for (let i = 0; i < count && !STOP; i++) {
      for (const item of vcGateways) {
        item.gw.send(4, { guild_id: gid, channel_id: ch, self_mute: false, self_deaf: false });
        await sleep(150);
        item.gw.send(4, { guild_id: gid, channel_id: null });
        await sleep(150);
      }
    }
  }
  for (const item of vcGateways) item.gw.send(4, { guild_id: gid, channel_id: ch, self_mute: false, self_deaf: false });
  log('VC参加（居続け）', 'ok');
}

function buildActivity(v) {
  const typeNum = { Playing: 0, Streaming: 1, Listening: 2, Watching: 3, Competing: 5, Custom: 4 }[v['Activity Type']] ?? 0;
  const name = v['Activity Name'] || '';
  const a = { name: typeNum === 4 ? 'Custom Status' : (name || '...'), type: typeNum };
  if (typeNum === 4) { a.state = name; return a; }
  if (typeNum === 1 && v['Stream URL']) a.url = v['Stream URL'];
  if (v['State']) a.state = v['State'];
  if (v['Details']) a.details = v['Details'];
  if (+v['Party Size'] || +v['Party Max']) a.party = { size: [+v['Party Size'] || 0, +v['Party Max'] || 0] };
  const ts = {};
  if (+v['Timestamps Start']) ts.start = +v['Timestamps Start'] * 1000;
  if (+v['Timestamps End']) ts.end = +v['Timestamps End'] * 1000;
  if (Object.keys(ts).length) a.timestamps = ts;
  if (v['Action Button']) { const b = [v['Button 1 ラベル'], v['Button 2 ラベル']].filter(Boolean); if (b.length) a.buttons = b; }
  return a;
}

async function runStatusStart(v) {
  const toks = parse(v['トークン']);
  const actObj = buildActivity(v);
  const first = toks[0];
  try { statusGw = await connectGateway(first); } catch (e) { return log('接続失敗: ' + e.message, 'danger'); }
  statusGw.send(3, { status: 'online', activities: [actObj], since: 0, afk: false });
  log('Start: ' + JSON.stringify(actObj), 'ok');
}

async function runSlash(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'];
  const name = (v['コマンド名'] || '').replace(/^\//, '');
  const count = +v['実行回数'] || 1;
  if (!ch) return log('チャンネルIDが必要', 'warn');
  const chan = await dapi(`/channels/${ch}`, toks[0]);
  if (chan.type === 2 && !v['ボイスチャンネルを含める']) log('※ボイスチャンネルです', 'warn');
  const idx = await dapi(`/guilds/${chan.guild_id}/application-command-index`, toks[0]);
  const cmd = (idx.application_commands || []).find(c => c.name === name);
  if (!cmd) return log('コマンドが見つかりません: ' + name, 'warn');
  for (let i = 0; i < count && !STOP; i++) {
    for (const t of toks) {
      try {
        const gw = await connectGateway(t);
        await dapi('/interactions', t, { method: 'POST', body: JSON.stringify({
          type: 2, application_id: cmd.application_id, guild_id: chan.guild_id, channel_id: ch,
          session_id: gw.sessionId,
          data: { version: cmd.version, id: cmd.id, name: cmd.name, type: 1, options: [], application_command: cmd },
          nonce: uid()
        })});
        gw.close(); log('実行', 'ok');
      } catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }
}

async function runButton(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'], mid = v['メッセージID'];
  const picks = parse(v['ボタン番号']);
  const count = +v['クリック回数'] || 1;
  const msg = await dapi(`/channels/${ch}/messages/${mid}`, toks[0]);
  const buttons = [];
  (msg.components || []).forEach(row => (row.components || []).forEach(c => buttons.push(c)));
  if (!buttons.length) return log('ボタンがありません', 'warn');
  const targets = picks.length ? picks.map(n => buttons[+n - 1]).filter(Boolean) : buttons;
  for (let i = 0; i < count && !STOP; i++) {
    for (const t of toks) {
      for (const b of targets) {
        try {
          const gw = await connectGateway(t);
          const data = { custom_id: b.custom_id, component_type: b.type };
          if (b.type === 3 && b.options?.[0]) data.values = [b.options[0].value];
          await dapi('/interactions', t, { method: 'POST', body: JSON.stringify({
            type: 3, guild_id: msg.guild_id, channel_id: ch, message_id: mid,
            session_id: gw.sessionId, data, nonce: uid()
          })});
          gw.close(); log('クリック', 'ok');
        } catch (e) { log('失敗: ' + e.message, 'danger'); }
      }
    }
  }
}

async function runReport(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'], mid = v['メッセージID'];
  const reportType = Math.max(0, REPORT_TYPES.indexOf(v['通報タイプ']));
  const chan = await dapi(`/channels/${ch}`, toks[0]);
  for (const t of toks) {
    if (STOP) break;
    try {
      await dapi('/reports', t, { method: 'POST', body: JSON.stringify({
        channel_id: ch, message_id: mid, guild_id: chan.guild_id, report_type: reportType
      })});
      log('通報', 'ok');
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
}
