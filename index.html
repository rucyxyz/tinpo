<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Discord Tools</title>
<style>
  :root{
    --bg:#1e1f22; --bg2:#2b2d31; --bg3:#313338; --hover:#35373c;
    --line:#3f4147; --text:#dbdee1; --muted:#949ba4;
    --blurple:#5865f2; --blurple-h:#4752c4; --red:#da373c; --red-h:#b52a2f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:620px;margin:0 auto;padding:32px 16px 64px}
  .hidden{display:none !important}
  h1.page-title{font-size:22px;font-weight:800;margin:0 0 16px;letter-spacing:.5px;color:#fff}

  .search{width:100%;margin-bottom:18px}
  .search input{background:var(--bg2);border:1px solid var(--line)}

  .cards{display:flex;flex-direction:column;gap:10px}
  .card{display:flex;gap:14px;align-items:center;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:14px 16px;cursor:pointer;transition:background .12s,border-color .12s}
  .card:hover{background:var(--hover);border-color:var(--blurple)}
  .card-icon{flex:none;width:38px;height:38px;border-radius:9px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--blurple)}
  .card-icon svg{width:21px;height:21px}
  .card-body{min-width:0}
  .card-title{font-weight:700;color:#fff;margin-bottom:3px}
  .card-desc{color:var(--muted);font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}

  .back{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0;margin-bottom:16px;font-family:inherit}
  .back:hover{color:var(--text)}
  .detail-title{font-size:22px;font-weight:800;color:#fff;margin:0 0 6px}
  .detail-desc{color:var(--muted);margin:0 0 22px}

  .form{display:flex;flex-direction:column;gap:14px}
  .field label{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:6px}
  .inline{display:flex;align-items:center;gap:8px}
  .unit{color:var(--muted);font-size:13px;white-space:nowrap}
  input,textarea,select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;
    padding:9px 11px;font-family:inherit;font-size:13px;width:100%;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--blurple)}
  textarea{resize:vertical}
  .inline input,.inline textarea,.inline select{flex:1;width:auto}
  .inline input[type=number]{max-width:120px}

  .sec{border-top:1px solid var(--line);padding-top:4px}
  .sec-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:13px;
    color:var(--text);padding:8px 0;user-select:none}
  .sec-head .arrow{font-size:10px;color:var(--muted);transition:transform .15s}
  .sec.closed .arrow{transform:rotate(-90deg)}
  .sec-body{display:flex;flex-direction:column;gap:14px;padding:4px 0 8px}
  .sec.closed .sec-body{display:none}

  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
  .switch-row span:first-child{color:var(--muted);font-size:13px;font-weight:600}
  .switch{position:relative;width:42px;height:24px;flex:none}
  .switch input{display:none}
  .slider{position:absolute;inset:0;background:#4e5058;border-radius:12px;transition:.15s}
  .slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
  .switch input:checked + .slider{background:var(--blurple)}
  .switch input:checked + .slider::before{transform:translateX(18px)}

  button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;font-weight:600;font-size:14px;padding:11px 14px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-run{background:var(--blurple);color:#fff;width:100%;margin-top:22px}
  .btn-run:hover{background:var(--blurple-h)}
  .btn-secondary{background:var(--blurple);color:#fff;font-size:13px;padding:9px 12px}
  .btn-secondary:hover{background:var(--blurple-h)}
  .run-row{display:flex;gap:10px;margin-top:10px}
  .btn-stop{background:var(--red);color:#fff;flex:1}
  .btn-stop:hover{background:var(--red-h)}

    height:180px;overflow-y:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;margin-top:16px}
  .log-line{padding:2px 0}
  .ok{color:#3ba55d}.warn{color:#faa61a}.danger{color:#ed4245}.info{color:#c3c9d6}

<script>
const BASE = 'https://discord.com/api/v10';
let STOP = false;

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const parse = s => (s || '').split(/[\s,]+/).filter(Boolean);
const uid = () => Math.floor(Math.random() * 1e16).toString();

async function dapi(path, token, opts = {}) {
  const res = await fetch(BASE + path, {
    ...opts,
    headers: { 'Authorization': token, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (res.status === 429) {
    const d = await res.json().catch(() => ({}));
    await sleep((d.retry_after || 1) * 1000 + 60);
    return dapi(path, token, opts);
  }
  if (res.status === 204) return null;
  if (!res.ok) {
    let m = 'HTTP ' + res.status;
    try { const d = await res.json(); m = d.message || m; } catch (e) {}
    throw new Error(m);
  }
  return res.json();
}

function log(msg, type = 'info') {
  const box = $('#logBox');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'log-line ' + type;
  el.textContent = `[${new Date().toLocaleTimeString('ja-JP')}] ${msg}`;
  box.prepend(el);
}

/* ================= Gateway ================= */
function connectGateway(token) {
  return new Promise((resolve, reject) => {
    let ws;
    try { ws = new WebSocket('wss://gateway.discord.gg/?v=10&encoding=json'); }
    catch (e) { return reject(e); }
    const gw = { ws, token, seq: null, hb: null };
    const to = setTimeout(() => reject(new Error('Gateway timeout')), 15000);
    ws.onmessage = ev => {
      const p = JSON.parse(ev.data);
      if (p.op === 10) {
        gw.hb = setInterval(() => ws.send(JSON.stringify({ op: 1, d: gw.seq })), p.d.heartbeat_interval);
        ws.send(JSON.stringify({ op: 2, d: {
          token, capabilities: 125, compress: false,
          properties: { os: 'Windows', browser: 'Chrome', device: 'desktop', system_locale: 'ja-JP' }
        }}));
      } else if (p.op === 0) {
        gw.seq = p.s;
        if (p.t === 'READY') {
          gw.sessionId = p.d.session_id;
          gw.user = p.d.user;
          clearTimeout(to);
          resolve(gw);
        }
      }
    };
    ws.onerror = () => { clearTimeout(to); reject(new Error('Gateway接続失敗')); };
    ws.onclose = () => clearInterval(gw.hb);
    gw.send = (op, d) => ws.send(JSON.stringify({ op, d }));
    gw.close = () => { clearInterval(gw.hb); try { ws.close(); } catch (e) {} };
  });
}

/* ================= 一覧 ================= */
function showHome(q = '') {
  $('#toolView').classList.add('hidden');
  const home = $('#home');
  home.classList.remove('hidden');
  const list = TOOLS.filter(t => (t.title + t.desc).toLowerCase().includes(q.toLowerCase()));
  home.innerHTML =
    `<h1 class="page-title">Discord Tools</h1>
     <div class="search"><input id="search" placeholder="ツールを検索..." value="${q}"></div>
     <div class="cards">` +
    (list.length ? list.map(t => `<div class="card" data-id="${t.id}">
        <div class="card-icon">${ICONS[t.icon] || ''}</div>
        <div class="card-body"><div class="card-title">${t.title}</div><div class="card-desc">${t.desc}</div></div>
      </div>`).join('') : `<div class="empty">該当するツールがありません</div>`) +
    `</div>`;

  const s = $('#search');
  s.oninput = () => {
    const v = s.value;
    showHome(v);
    const ns = $('#search'); ns.focus(); ns.setSelectionRange(v.length, v.length);
  };
  home.querySelectorAll('.card').forEach(c => c.onclick = () => showTool(c.dataset.id));
}

/* ================= 詳細 ================= */
function fieldHTML(f) {
  if (f.t === 'toggle') return `<label class="switch-row"><span>${f.label}</span>
      <span class="switch"><input type="checkbox" data-label="${f.label}"><span class="slider"></span></span></label>`;
  if (f.t === 'btn') return `<button class="btn-secondary" data-act="${f.act}">${f.label}</button>`;
  if (f.t === 'select') {
    const opts = f.options.map(o => `<option>${o}</option>`).join('');
    return `<div class="field"><label>${f.label}</label><select data-label="${f.label}">${opts}</select></div>`;
  }
  const unit = f.unit ? `<span class="unit">${f.unit}</span>` : '';
  const input = f.t === 'area'
    ? `<textarea data-label="${f.label}" rows="3" placeholder="${f.ph || ''}"></textarea>`
    : f.t === 'num'
      ? `<input type="number" data-label="${f.label}" value="${f.val ?? 0}">`
      : `<input data-label="${f.label}" placeholder="${f.ph || ''}">`;
  return `<div class="field"><label>${f.label}</label><div class="inline">${input}${unit}</div></div>`;
}

function renderForm(fields) {
  let html = '', open = false;
  const flush = () => { if (open) html += '</div></div>'; };
  for (const f of fields) {
    if (f.t === 'section') {
      flush();
      html += `<div class="sec"><div class="sec-head"><span class="arrow">▼</span>${f.label}</div><div class="sec-body">`;
      open = true;
    } else html += fieldHTML(f);
  }
  flush();
  return html;
}

function showTool(id) {
  const t = TOOLS.find(x => x.id === id);
  $('#home').classList.add('hidden');
  const view = $('#toolView');
  view.classList.remove('hidden');
  view.innerHTML = `
    <button class="back" id="backBtn">← 戻る</button>
    <h1 class="detail-title">${t.title}</h1>
    <p class="detail-desc">${t.desc}</p>
    <div class="form" id="toolForm">${renderForm(t.fields)}</div>
    <button class="btn-run" id="runBtn">実行</button>
    <div class="run-row"><button class="btn-stop" id="stopBtn">停止</button></div>
    <div class="logbox" id="logBox"></div>`;

  $('#backBtn').onclick = () => showHome();
  $('#stopBtn').onclick = () => { STOP = true; log('停止', 'warn'); };
  $('#runBtn').onclick = async () => {
    STOP = false;
    $('#runBtn').disabled = true;
    const v = collect();
    log('実行開始', 'info');
    try { await t.run(v); log('実行終了', 'ok'); }
    catch (e) { log('エラー: ' + e.message, 'danger'); }
    $('#runBtn').disabled = false;
  };
  view.querySelectorAll('.sec-head').forEach(h => h.onclick = () => h.parentElement.classList.toggle('closed'));
  view.querySelectorAll('[data-act]').forEach(b => b.onclick = () => handleBtn(b.dataset.act));
  window.scrollTo(0, 0);
}

function collect() {
  const out = {};
  document.querySelectorAll('#toolForm [data-label]').forEach(el => {
    out[el.dataset.label] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return out;
}
function setVal(label, val) {
  const el = document.querySelector(`#toolForm [data-label="${label}"]`);
  if (el) el.value = val;
}

async function handleBtn(act) {
  const v = collect();
  const tk = parse(v['トークン'])[0];
  if (!tk) return log('トークンを入力してください', 'warn');
  if (act === 'fetchChannels') {
    const gid = v['サーバーID'];
    if (!gid) return log('サーバーIDを入力してください', 'warn');
    try {
      const chs = await dapi(`/guilds/${gid}/channels`, tk);
      setVal('チャンネルID', chs.filter(c => c.type === 0 || c.type === 5).map(c => c.id).join('\n'));
      log('チャンネルを取得しました', 'ok');
    } catch (e) { log('取得失敗: ' + e.message, 'danger'); }
  }
}

/* ================= 各ツール ================= */
async function runTokenChecker(v) {
  const toks = parse(v['トークン']);
  let ok = 0, bad = 0;
  for (const t of toks) {
    try {
      const u = await dapi('/users/@me', t);
      log('有効: ' + u.username + (v['アカウント情報を表示'] ? ` (ID:${u.id} メール:${u.email || '-'})` : ''), 'ok');
      ok++;
    } catch (e) { log('無効: ' + t.slice(0, 14) + '...', 'danger'); bad++; }
  }
  log(`結果 → 有効 ${ok} / 無効 ${bad}`, 'info');
}

async function runReaction(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'];
  const emoji = encodeURIComponent(v['絵文字'] || '🔥');
  const count = +v['回数'] || 1, delay = +v['間隔'] || 0;
  let mid = v['メッセージID'];
  if (!mid) {
    const msgs = await dapi(`/channels/${ch}/messages?limit=1`, toks[0]);
    if (!msgs.length) return log('メッセージがありません', 'warn');
    mid = msgs[0].id;
  }
  for (let i = 0; i < count && !STOP; i++) {
    for (const tk of toks) {
      try {
        await dapi(`/channels/${ch}/messages/${mid}/reactions/${emoji}/@me`, tk, { method: 'PUT' });
        await dapi(`/channels/${ch}/messages/${mid}/reactions/${emoji}/@me`, tk, { method: 'DELETE' });
      } catch (e) {}
    }
    if (delay) await sleep(delay);
  }
}

async function runRaider(v) {
  const toks = parse(v['トークン']);
  const chs = parse(v['チャンネルID']);
  const base = v['メッセージ内容'] || '';
  const delay = (+v['送信間隔'] || 0) * 1000;
  const limit = +v['送信上限'] || 0;
  const rand = v['メッセージをランダム化'];
  let n = 0;
  outer:
  for (const tk of toks) {
    for (const ch of chs) {
      if (STOP || (limit && n >= limit)) break outer;
      const content = rand ? base + ' ' + Math.random().toString(36).slice(2, 8) : base;
      try { await dapi(`/channels/${ch}/messages`, tk, { method: 'POST', body: JSON.stringify({ content }) }); n++; }
      catch (e) { log('失敗: ' + e.message, 'danger'); }
      if (delay) await sleep(delay);
    }
  }
  log(`送信完了 (${n}件)`, 'ok');
}

async function runInvite(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'];
  const count = +v['生成数'] || 0;
  const inf = v['無限に生成'];
  let i = 0;
  while (!STOP && (inf || i < count)) {
    for (const tk of toks) {
      try { const r = await dapi(`/channels/${ch}/invites`, tk, { method: 'POST', body: '{}' }); log('discord.gg/' + r.code, 'ok'); }
      catch (e) { log('失敗: ' + e.message, 'danger'); }
      i++;
    }
  }
}

async function runWebhook(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'];
  const content = v['メッセージ内容'] || '';
  const count = +v['送信回数'] || 1;
  for (const tk of toks) {
    let wh;
    try { wh = await dapi(`/channels/${ch}/webhooks`, tk, { method: 'POST', body: JSON.stringify({ name: v['Webhook名'] || 'spam' }) }); }
    catch (e) { log('Webhook作成失敗: ' + e.message, 'danger'); continue; }
    for (let i = 0; i < count && !STOP; i++) {
      try { await dapi(`/webhooks/${wh.id}/${wh.token}`, tk, { method: 'POST', body: JSON.stringify({ content }) }); }
      catch (e) { log('送信失敗: ' + e.message, 'danger'); }
    }
    if (v['終了後にWebhookを削除']) await dapi(`/webhooks/${wh.id}`, tk, { method: 'DELETE' }).catch(() => {});
  }
  log('完了', 'ok');
}

async function runJoiner(v) {
  const toks = parse(v['トークン']);
  const raw = v['招待リンク または サーバーID'] || '';
  const code = raw.includes('discord') ? raw.split('/').pop().split('?')[0] : raw;
  const leave = v['参加後に自動退出'];
  let n = 0;
  for (const tk of toks) {
    if (STOP) break;
    try {
      const g = await dapi(`/invites/${code}`, tk, { method: 'POST', body: '{}' });
      n++;
      log('参加: ' + (g.guild?.name || code), 'ok');
      if (leave && g.guild?.id) await dapi(`/users/@me/guilds/${g.guild.id}`, tk, { method: 'DELETE' });
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
  log(`完了 (${n}人)`, 'ok');
}

async function runNickAvatar(v) {
  const toks = parse(v['トークン']);
  const gid = v['サーバーID'];
  const nick = v['新しいニックネーム'];
  const url = v['アイコン画像URL'];
  let dataUri;
  if (url) {
    const blob = await (await fetch(url)).blob();
    dataUri = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  }
  for (const tk of toks) {
    if (STOP) break;
    try {
      if (nick && gid) await dapi(`/guilds/${gid}/members/@me`, tk, { method: 'PATCH', body: JSON.stringify({ nick }) });
      if (dataUri) await dapi('/users/@me', tk, { method: 'PATCH', body: JSON.stringify({ avatar: dataUri }) });
      log('更新', 'ok');
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
}

async function runThread(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'];
  const name = v['スレッド名'] || 'thread';
  const count = +v['作成数'] || 1;
  for (let i = 0; i < count && !STOP; i++) {
    for (const tk of toks) {
      try { await dapi(`/channels/${ch}/threads`, tk, { method: 'POST', body: JSON.stringify({ name: `${name}-${i + 1}`, type: 11 }) }); log('作成 ' + (i + 1), 'ok'); }
      catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }
}

async function runGroup(v) {
  const toks = parse(v['トークン']);
  const users = parse(v['相手のユーザーID']);
  const content = v['メッセージ内容'] || '';
  const count = +v['送信回数'] || 1;
  for (const tk of toks) {
    if (STOP) break;
    try {
      const g = await dapi('/channels', tk, { method: 'POST', body: JSON.stringify({ recipients: users }) });
      for (let i = 0; i < count && !STOP; i++)
        await dapi(`/channels/${g.id}/messages`, tk, { method: 'POST', body: JSON.stringify({ content }) }).catch(() => {});
      log('グループDM作成', 'ok');
      if (v['作成後に退出']) await dapi(`/channels/${g.id}`, tk, { method: 'DELETE' });
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
}

async function runFriend(v) {
  const toks = parse(v['トークン']);
  const users = parse(v['ユーザーID']);
  const content = v['DMメッセージ'] || '';
  for (const tk of toks) {
    for (const u of users) {
      if (STOP) break;
      try {
        if (v['フレンド申請を送る']) await dapi(`/users/@me/relationships/${u}`, tk, { method: 'PUT', body: '{}' });
        if (v['DMを送る']) {
          const dm = await dapi('/users/@me/channels', tk, { method: 'POST', body: JSON.stringify({ recipient_id: u }) });
          await dapi(`/channels/${dm.id}/messages`, tk, { method: 'POST', body: JSON.stringify({ content }) });
        }
      } catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }
}

async function runHypeSquad(v) {
  const toks = parse(v['トークン']);
  const map = { Bravery: 1, Brilliance: 2, Balance: 3 };
  const house = map[v['選択']];
  for (const tk of toks) {
    if (STOP) break;
    try {
      if (house) { await dapi('/hypesquad/hypesquad-online', tk, { method: 'POST', body: JSON.stringify({ house_id: house }) }); log('変更', 'ok'); }
      else { await dapi('/hypesquad/hypesquad-online', tk, { method: 'DELETE' }); log('離脱', 'ok'); }
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
}

/* --- Gateway系 --- */
async function runVc(v) {
  const toks = parse(v['トークン']);
  const gid = v['サーバーID'], ch = v['ボイスチャンネルID'];
  const count = +v['繰り返し回数'] || 1;
  const gws = [];
  for (const t of toks) { try { gws.push(await connectGateway(t)); } catch (e) { log('接続失敗: ' + e.message, 'danger'); } }
  log('Gateway接続: ' + gws.length, 'info');
  for (let i = 0; i < count && !STOP; i++) {
    for (const gw of gws) {
      gw.send(4, { guild_id: gid, channel_id: ch, self_mute: false, self_deaf: false });
      await sleep(120);
      gw.send(4, { guild_id: gid, channel_id: null });
      await sleep(120);
    }
  }
  gws.forEach(g => g.close());
  log('完了', 'ok');
}

async function runStatus(v) {
  const toks = parse(v['トークン']);
  const text = v['ステータステキスト'];
  const status = v['状態'] || 'online';
  for (const t of toks) {
    if (STOP) break;
    try {
      const gw = await connectGateway(t);
      gw.send(3, { status, activities: text ? [{ name: text, type: 0 }] : [], since: 0, afk: false });
      await sleep(600);
      gw.close();
      log('設定', 'ok');
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
}

async function runSlash(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'];
  const name = (v['コマンド名'] || '').replace(/^\//, '');
  const count = +v['実行回数'] || 1;
  if (!ch) return log('チャンネルIDが必要', 'warn');
  const chan = await dapi(`/channels/${ch}`, toks[0]);
  const idx = await dapi(`/guilds/${chan.guild_id}/application-command-index`, toks[0]);
  const cmd = (idx.application_commands || []).find(c => c.name === name);
  if (!cmd) return log('コマンドが見つかりません: ' + name, 'warn');
  for (let i = 0; i < count && !STOP; i++) {
    for (const t of toks) {
      try {
        const gw = await connectGateway(t);
        await dapi('/interactions', t, { method: 'POST', body: JSON.stringify({
          type: 2, application_id: cmd.application_id, guild_id: chan.guild_id, channel_id: ch,
          session_id: gw.sessionId,
          data: { version: cmd.version, id: cmd.id, name: cmd.name, type: 1, options: [], application_command: cmd },
          nonce: uid()
        })});
        gw.close();
        log('実行', 'ok');
      } catch (e) { log('失敗: ' + e.message, 'danger'); }
    }
  }
}

async function runButton(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'], mid = v['メッセージID'];
  const picks = parse(v['ボタン番号']);
  const count = +v['クリック回数'] || 1;
  const msg = await dapi(`/channels/${ch}/messages/${mid}`, toks[0]);
  const buttons = [];
  (msg.components || []).forEach(row => (row.components || []).forEach(c => buttons.push(c)));
  if (!buttons.length) return log('ボタンがありません', 'warn');
  const targets = picks.length ? picks.map(n => buttons[+n - 1]).filter(Boolean) : buttons;
  for (let i = 0; i < count && !STOP; i++) {
    for (const t of toks) {
      for (const b of targets) {
        try {
          const gw = await connectGateway(t);
          const data = { custom_id: b.custom_id, component_type: b.type };
          if (b.type === 3 && b.options?.[0]) data.values = [b.options[0].value];
          await dapi('/interactions', t, { method: 'POST', body: JSON.stringify({
            type: 3, guild_id: msg.guild_id, channel_id: ch, message_id: mid,
            session_id: gw.sessionId, data, nonce: uid()
          })});
          gw.close();
          log('クリック', 'ok');
        } catch (e) { log('失敗: ' + e.message, 'danger'); }
      }
    }
  }
}

async function runReport(v) {
  const toks = parse(v['トークン']);
  const ch = v['チャンネルID'], mid = v['メッセージID'];
  const chan = await dapi(`/channels/${ch}`, toks[0]);
  for (const t of toks) {
    if (STOP) break;
    try {
      await dapi('/reports', t, { method: 'POST', body: JSON.stringify({
        channel_id: ch, message_id: mid, guild_id: chan.guild_id, report_type: 0
      })});
      log('通報', 'ok');
    } catch (e) { log('失敗: ' + e.message, 'danger'); }
  }
}

showHome();
</script>
